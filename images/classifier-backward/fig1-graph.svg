<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="860" height="350" fill="#ffffff"/>
  <text x="20" y="26" text-anchor="start" font-size="15" fill="#212529" font-weight="600">The classifier's forward for one row: every use of every value</text>
  <text x="20" y="44" text-anchor="start" font-size="13" fill="#495057">Each arrow is one use, labelled with the forward step that makes it (F) and the backward step that goes back along it (B).</text>
  <text x="20" y="60" text-anchor="start" font-size="13" fill="#495057">z has two arrows going out (F1 and F2), and so does a (F3 for every column, F5 for the target's column).</text>
  <path d="M 300 172 C 300 102, 780 102, 780 170" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="112" text-anchor="middle" font-size="13" fill="#212529">F5 · <tspan fill="#e8590c" font-weight="600">B4</tspan>: ℓ = log S − aₜ uses the target's column of a a second time</text>
  <rect x="70.0" y="172.0" width="80" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="110" y="195.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">z</text>
  <rect x="160.0" y="100.0" width="80" height="36" rx="6" fill="#f8f9fa" stroke="#868e96"/>
  <text x="200" y="123.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">m</text>
  <rect x="260.0" y="172.0" width="80" height="36" rx="6" fill="#f8f9fa" stroke="#868e96"/>
  <text x="300" y="195.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">a</text>
  <rect x="410.0" y="172.0" width="80" height="36" rx="6" fill="#f8f9fa" stroke="#868e96"/>
  <text x="450" y="195.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">e</text>
  <rect x="560.0" y="172.0" width="80" height="36" rx="6" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="600" y="195.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">S</text>
  <rect x="740.0" y="172.0" width="80" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="780" y="195.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">ℓ</text>
  <line x1="150" y1="190" x2="258" y2="190" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="208" text-anchor="middle" font-size="12" fill="#212529">F2 · <tspan fill="#e8590c" font-weight="600">B6</tspan></text>
  <line x1="340" y1="190" x2="408" y2="190" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="183" text-anchor="middle" font-size="12" fill="#212529">F3 · <tspan fill="#e8590c" font-weight="600">B3</tspan></text>
  <line x1="490" y1="190" x2="558" y2="190" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="525" y="183" text-anchor="middle" font-size="12" fill="#212529">F4 · <tspan fill="#e8590c" font-weight="600">B2</tspan></text>
  <line x1="640" y1="190" x2="738" y2="190" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="183" text-anchor="middle" font-size="12" fill="#212529">F5 · <tspan fill="#e8590c" font-weight="600">B1</tspan></text>
  <line x1="120" y1="172" x2="168" y2="137" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="132" y="150" text-anchor="end" font-size="12" fill="#212529">F1 · <tspan fill="#e8590c" font-weight="600">B7</tspan></text>
  <line x1="232" y1="137" x2="280" y2="171" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="266" y="150" text-anchor="start" font-size="12" fill="#212529">F2 · <tspan fill="#e8590c" font-weight="600">B6</tspan></text>
  <text x="200" y="92" text-anchor="middle" font-size="11" fill="#868e96">largest z, one per row: <tspan fill="#1971c2">3</tspan></text>
  <text x="110" y="226" text-anchor="middle" font-size="11" fill="#868e96">logits: input</text>
  <text x="110" y="239" text-anchor="middle" font-size="11" fill="#868e96">one per word</text>
  <text x="110" y="260" text-anchor="middle" font-size="11" fill="#1971c2">1, 2, 3, −1</text>
  <text x="300" y="226" text-anchor="middle" font-size="11" fill="#868e96">z − m</text>
  <text x="300" y="239" text-anchor="middle" font-size="11" fill="#868e96">one per word</text>
  <text x="300" y="260" text-anchor="middle" font-size="11" fill="#1971c2">−2, −1, 0, −4</text>
  <text x="450" y="226" text-anchor="middle" font-size="11" fill="#868e96">exp(a)</text>
  <text x="450" y="239" text-anchor="middle" font-size="11" fill="#868e96">one per word</text>
  <text x="450" y="260" text-anchor="middle" font-size="11" fill="#1971c2">0.135, 0.368, 1, 0.018</text>
  <text x="600" y="226" text-anchor="middle" font-size="11" fill="#868e96">sum of e over the row</text>
  <text x="600" y="239" text-anchor="middle" font-size="11" fill="#868e96">one per row</text>
  <text x="600" y="260" text-anchor="middle" font-size="11" fill="#1971c2">1.5215304</text>
  <text x="780" y="226" text-anchor="middle" font-size="11" fill="#868e96">log S − aₜ: the loss</text>
  <text x="780" y="239" text-anchor="middle" font-size="11" fill="#868e96">one per row</text>
  <text x="780" y="260" text-anchor="middle" font-size="11" fill="#1971c2">1.4197166</text>
  <text x="20" y="260" text-anchor="start" font-size="11" fill="#1971c2">example:</text>
  <text x="20" y="300" text-anchor="start" font-size="13" fill="#495057">a is used twice, so its gradient has two parts: B3 gives da<tspan dy="-5" font-size="0.75em">(1)</tspan><tspan dy="5"> for every column,</tspan></text>
  <text x="20" y="317" text-anchor="start" font-size="13" fill="#495057">B4 gives da<tspan dy="-5" font-size="0.75em">(2)</tspan><tspan dy="5"> for the target's column only, and B5 adds them. z is used twice too, by F1 and F2: B7 adds a part through m.</tspan></text>
  <text x="20" y="334" text-anchor="start" font-size="13" fill="#495057">S is one sum made from every column of e, so every column gets a piece of dS. Rows never mix: each of the 4096 rows has a graph of its own.</text>
</svg>
