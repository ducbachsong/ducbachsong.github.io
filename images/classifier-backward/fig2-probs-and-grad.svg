<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 416" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="860" height="416" fill="#ffffff"/>
  <text x="20" y="26" text-anchor="start" font-size="15" fill="#212529" font-weight="600">The example row: probabilities, and the gradient that goes back into the logits</text>
  <text x="20" y="44" text-anchor="start" font-size="13" fill="#495057">logits z = [1, 2, 3, −1], the right next word is word 1, dℓ = 1. Left: p = softmax(z). Right: dz = dℓ · (p − 1 at the target).</text>
  <text x="20" y="60" text-anchor="start" font-size="13" fill="#495057">The optimizer moves each logit against its gradient: word 1 goes up, the other three go down, each by as much probability as it got.</text>
  <line x1="70" y1="319.0" x2="430" y2="319.0" stroke="#e9ecef"/>
  <text x="62" y="323.0" text-anchor="end" font-size="11" fill="#868e96">-0.8</text>
  <line x1="70" y1="267.0" x2="430" y2="267.0" stroke="#e9ecef"/>
  <text x="62" y="271.0" text-anchor="end" font-size="11" fill="#868e96">-0.4</text>
  <line x1="70" y1="215.0" x2="430" y2="215.0" stroke="#adb5bd"/>
  <text x="62" y="219.0" text-anchor="end" font-size="11" fill="#868e96">0</text>
  <line x1="70" y1="163.0" x2="430" y2="163.0" stroke="#e9ecef"/>
  <text x="62" y="167.0" text-anchor="end" font-size="11" fill="#868e96">0.4</text>
  <line x1="70" y1="111.0" x2="430" y2="111.0" stroke="#e9ecef"/>
  <text x="62" y="115.0" text-anchor="end" font-size="11" fill="#868e96">0.8</text>
  <text x="250.0" y="92" text-anchor="middle" font-size="13" fill="#212529" font-weight="600">p: probability of each word</text>
  <rect x="90" y="203.4" width="50" height="11.6" fill="#1971c2" fill-opacity="0.85"/>
  <text x="115" y="197.4" text-anchor="middle" font-size="11" fill="#1971c2" font-weight="600">0.0889</text>
  <text x="115" y="366" text-anchor="middle" font-size="12" fill="#212529">word 0</text>
  <text x="115" y="380" text-anchor="middle" font-size="11" fill="#868e96">z = 1</text>
  <rect x="180" y="183.6" width="50" height="31.4" fill="#e8590c" fill-opacity="0.85"/>
  <text x="205" y="177.6" text-anchor="middle" font-size="11" fill="#e8590c" font-weight="600">0.2418</text>
  <text x="205" y="366" text-anchor="middle" font-size="12" fill="#212529">word 1</text>
  <text x="205" y="380" text-anchor="middle" font-size="11" fill="#e8590c">target, z = 2</text>
  <rect x="270" y="129.6" width="50" height="85.4" fill="#1971c2" fill-opacity="0.85"/>
  <text x="295" y="123.6" text-anchor="middle" font-size="11" fill="#1971c2" font-weight="600">0.6572</text>
  <text x="295" y="366" text-anchor="middle" font-size="12" fill="#212529">word 2</text>
  <text x="295" y="380" text-anchor="middle" font-size="11" fill="#868e96">z = 3</text>
  <rect x="360" y="213.4" width="50" height="1.6" fill="#1971c2" fill-opacity="0.85"/>
  <text x="385" y="207.4" text-anchor="middle" font-size="11" fill="#1971c2" font-weight="600">0.0120</text>
  <text x="385" y="366" text-anchor="middle" font-size="12" fill="#212529">word 3</text>
  <text x="385" y="380" text-anchor="middle" font-size="11" fill="#868e96">z = −1</text>
  <line x1="480" y1="319.0" x2="840" y2="319.0" stroke="#e9ecef"/>
  <text x="472" y="323.0" text-anchor="end" font-size="11" fill="#868e96">-0.8</text>
  <line x1="480" y1="267.0" x2="840" y2="267.0" stroke="#e9ecef"/>
  <text x="472" y="271.0" text-anchor="end" font-size="11" fill="#868e96">-0.4</text>
  <line x1="480" y1="215.0" x2="840" y2="215.0" stroke="#adb5bd"/>
  <text x="472" y="219.0" text-anchor="end" font-size="11" fill="#868e96">0</text>
  <line x1="480" y1="163.0" x2="840" y2="163.0" stroke="#e9ecef"/>
  <text x="472" y="167.0" text-anchor="end" font-size="11" fill="#868e96">0.4</text>
  <line x1="480" y1="111.0" x2="840" y2="111.0" stroke="#e9ecef"/>
  <text x="472" y="115.0" text-anchor="end" font-size="11" fill="#868e96">0.8</text>
  <text x="660.0" y="92" text-anchor="middle" font-size="13" fill="#212529" font-weight="600">dz = p − 1 at the target</text>
  <rect x="500" y="203.4" width="50" height="11.6" fill="#1971c2" fill-opacity="0.85"/>
  <text x="525" y="197.4" text-anchor="middle" font-size="11" fill="#1971c2" font-weight="600">0.0889</text>
  <text x="525" y="366" text-anchor="middle" font-size="12" fill="#212529">word 0</text>
  <text x="525" y="380" text-anchor="middle" font-size="11" fill="#868e96">z = 1</text>
  <rect x="590" y="215.0" width="50" height="98.6" fill="#e8590c" fill-opacity="0.85"/>
  <text x="615" y="328.6" text-anchor="middle" font-size="11" fill="#e8590c" font-weight="600">−0.7582</text>
  <text x="615" y="366" text-anchor="middle" font-size="12" fill="#212529">word 1</text>
  <text x="615" y="380" text-anchor="middle" font-size="11" fill="#e8590c">target, z = 2</text>
  <rect x="680" y="129.6" width="50" height="85.4" fill="#1971c2" fill-opacity="0.85"/>
  <text x="705" y="123.6" text-anchor="middle" font-size="11" fill="#1971c2" font-weight="600">0.6572</text>
  <text x="705" y="366" text-anchor="middle" font-size="12" fill="#212529">word 2</text>
  <text x="705" y="380" text-anchor="middle" font-size="11" fill="#868e96">z = 3</text>
  <rect x="770" y="213.4" width="50" height="1.6" fill="#1971c2" fill-opacity="0.85"/>
  <text x="795" y="207.4" text-anchor="middle" font-size="11" fill="#1971c2" font-weight="600">0.0120</text>
  <text x="795" y="366" text-anchor="middle" font-size="12" fill="#212529">word 3</text>
  <text x="795" y="380" text-anchor="middle" font-size="11" fill="#868e96">z = −1</text>
  <text x="20" y="404" text-anchor="start" font-size="13" fill="#495057">Both panels add up the same way: p adds up to 1, so dz adds up to 1 − 1 = 0. Word 2 got the most probability, so it is pushed down the most.</text>
</svg>
