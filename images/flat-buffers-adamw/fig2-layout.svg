<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
    <pattern id="pad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f1f3f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#ced4da" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>

  <!-- the model's parameters, in the order the model lists them -->
  <text x="20" y="26" font-size="14" font-weight="600" fill="#212529">The model's parameters (as the layers see them)</text>
  <g font-size="11">
    <rect x="20"  y="38" width="70" height="26" rx="3" fill="#dbe4ff" stroke="#748ffc"/><text x="30"  y="55">wte</text>
    <rect x="96"  y="38" width="70" height="26" rx="3" fill="#dbe4ff" stroke="#748ffc"/><text x="106" y="55">wpe</text>
    <rect x="172" y="38" width="80" height="26" rx="3" fill="#e9ecef" stroke="#adb5bd"/><text x="180" y="55">ln_1.weight</text>
    <rect x="258" y="38" width="70" height="26" rx="3" fill="#e9ecef" stroke="#adb5bd"/><text x="266" y="55">ln_1.bias</text>
    <rect x="334" y="38" width="96" height="26" rx="3" fill="#dbe4ff" stroke="#748ffc"/><text x="342" y="55">c_attn.weight</text>
    <rect x="436" y="38" width="80" height="26" rx="3" fill="#e9ecef" stroke="#adb5bd"/><text x="444" y="55">c_attn.bias</text>
    <text x="528" y="55" fill="#495057">…  148 tensors, mixed, layer by layer</text>
  </g>

  <!-- arrows: each parameter becomes a view into its segment -->
  <g stroke="#868e96" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M55,64 C55,110 105,120 110,150"/>
    <path d="M131,64 C131,110 190,120 195,150"/>
    <path d="M382,64 C382,110 300,120 290,150"/>
    <path d="M212,64 C212,110 520,110 540,150"/>
    <path d="M293,64 C293,100 590,110 598,150"/>
    <path d="M476,64 C476,100 650,110 655,150"/>
  </g>
  <text x="612" y="84" font-size="11" fill="#495057">parameter.set_(segment):</text>
  <text x="612" y="98" font-size="11" fill="#495057">each parameter becomes</text>
  <text x="612" y="112" font-size="11" fill="#495057">a view into the buffer</text>

  <!-- the flat Parameters buffer -->
  <text x="20" y="146" font-size="12" font-weight="600" fill="#212529">Parameters</text>
  <g>
    <rect x="20"  y="152" width="150" height="30" fill="#91a7ff"/>
    <rect x="170" y="152" width="50"  height="30" fill="#bac8ff"/>
    <rect x="220" y="152" width="120" height="30" fill="#91a7ff"/>
    <rect x="340" y="152" width="8"   height="30" fill="url(#pad)"/>
    <rect x="348" y="152" width="160" height="30" fill="#bac8ff"/>
    <rect x="508" y="152" width="20"  height="30" fill="#ced4da"/>
    <rect x="528" y="152" width="8"   height="30" fill="url(#pad)"/>
    <rect x="536" y="152" width="20"  height="30" fill="#dee2e6"/>
    <rect x="556" y="152" width="56"  height="30" fill="#ced4da"/>
    <rect x="612" y="152" width="8"   height="30" fill="url(#pad)"/>
    <rect x="620" y="152" width="70"  height="30" fill="#dee2e6"/>
    <rect x="690" y="152" width="50"  height="30" fill="#ced4da"/>
    <rect x="20"  y="152" width="720" height="30" fill="none" stroke="#495057"/>
  </g>
  <g font-size="11" fill="#212529">
    <text x="70" y="171">wte</text><text x="180" y="171">wpe</text><text x="250" y="171">c_attn.w</text><text x="400" y="171">… 50 matrices</text>
    <text x="578" y="171">ln, bias</text><text x="636" y="171">… 98</text>
  </g>

  <!-- decayed / not decayed brackets -->
  <g stroke="#e8590c" stroke-width="1.5" fill="none">
    <path d="M20,192 L20,200 L508,200 L508,192"/>
  </g>
  <g stroke="#868e96" stroke-width="1.5" fill="none">
    <path d="M508,192 L508,200 L740,200 L740,192"/>
  </g>
  <text x="140" y="216" font-size="12" fill="#e8590c">decayed: every matrix, [0, DecayedCount)</text>
  <text x="140" y="231" font-size="11" fill="#495057">weight decay = one mul_ on this block</text>
  <text x="560" y="216" font-size="12" fill="#495057">not decayed: 1-D tensors</text>

  <!-- the other buffers, same layout -->
  <g font-size="12">
    <text x="20" y="266" font-weight="600" fill="#212529">Gradients</text>
    <rect x="20" y="272" width="720" height="20" fill="#fff4e6" stroke="#ffa94d"/>
    <text x="30" y="287" font-size="11" fill="#495057">same layout: parameter.grad is a view of its segment, so backward() adds straight into it</text>

    <text x="20" y="316" font-weight="600" fill="#212529">m, v (AdamW's moments)</text>
    <rect x="20" y="322" width="720" height="20" fill="#ebfbee" stroke="#69db7c"/>
    <text x="30" y="337" font-size="11" fill="#495057">same layout again: every AdamW operation is element-wise over aligned buffers</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#495057">
    <rect x="20" y="364" width="14" height="12" fill="url(#pad)" stroke="#ced4da"/>
    <text x="40" y="374">padding: each segment starts on a multiple of 64 values (256 bytes); it stays 0</text>
  </g>
</svg>
