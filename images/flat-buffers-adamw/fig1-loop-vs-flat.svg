<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="330" fill="#ffffff"/>

  <!-- left panel: per-parameter loop -->
  <text x="20" y="28" font-size="15" font-weight="600" fill="#212529">(a) Per-parameter loop</text>
  <text x="20" y="46" fill="#495057">TorchSharp's AdamW, PyTorch for-loop</text>

  <g fill="#adb5bd">
    <rect x="20" y="66"  width="150" height="14" rx="2"/>
    <rect x="20" y="88"  width="60"  height="14" rx="2"/>
    <rect x="20" y="110" width="110" height="14" rx="2"/>
    <rect x="20" y="132" width="24"  height="14" rx="2"/>
    <rect x="20" y="154" width="24"  height="14" rx="2"/>
    <rect x="20" y="176" width="90"  height="14" rx="2"/>
    <rect x="20" y="198" width="24"  height="14" rx="2"/>
  </g>
  <text x="20" y="232" fill="#495057">⋮  148 parameter tensors</text>
  <g font-size="11" fill="#495057">
    <text x="176" y="77">wte</text><text x="86" y="99">wpe</text><text x="136" y="121">c_attn.weight</text>
    <text x="50" y="143">ln_1.weight</text><text x="50" y="165">ln_1.bias</text><text x="116" y="187">c_proj.weight</text><text x="50" y="209">c_attn.bias</text>
  </g>

  <!-- launches per tensor -->
  <g stroke="#e8590c" stroke-width="2">
    <line x1="262" y1="66" x2="262" y2="80"/><line x1="268" y1="66" x2="268" y2="80"/><line x1="274" y1="66" x2="274" y2="80"/><line x1="280" y1="66" x2="280" y2="80"/><line x1="286" y1="66" x2="286" y2="80"/><line x1="292" y1="66" x2="292" y2="80"/><line x1="298" y1="66" x2="298" y2="80"/><line x1="304" y1="66" x2="304" y2="80"/><line x1="310" y1="66" x2="310" y2="80"/><line x1="316" y1="66" x2="316" y2="80"/>
    <line x1="262" y1="88" x2="262" y2="102"/><line x1="268" y1="88" x2="268" y2="102"/><line x1="274" y1="88" x2="274" y2="102"/><line x1="280" y1="88" x2="280" y2="102"/><line x1="286" y1="88" x2="286" y2="102"/><line x1="292" y1="88" x2="292" y2="102"/><line x1="298" y1="88" x2="298" y2="102"/><line x1="304" y1="88" x2="304" y2="102"/><line x1="310" y1="88" x2="310" y2="102"/><line x1="316" y1="88" x2="316" y2="102"/>
    <line x1="262" y1="110" x2="262" y2="124"/><line x1="268" y1="110" x2="268" y2="124"/><line x1="274" y1="110" x2="274" y2="124"/><line x1="280" y1="110" x2="280" y2="124"/><line x1="286" y1="110" x2="286" y2="124"/><line x1="292" y1="110" x2="292" y2="124"/><line x1="298" y1="110" x2="298" y2="124"/><line x1="304" y1="110" x2="304" y2="124"/><line x1="310" y1="110" x2="310" y2="124"/><line x1="316" y1="110" x2="316" y2="124"/>
    <line x1="262" y1="132" x2="262" y2="146"/><line x1="268" y1="132" x2="268" y2="146"/><line x1="274" y1="132" x2="274" y2="146"/><line x1="280" y1="132" x2="280" y2="146"/><line x1="286" y1="132" x2="286" y2="146"/><line x1="292" y1="132" x2="292" y2="146"/><line x1="298" y1="132" x2="298" y2="146"/><line x1="304" y1="132" x2="304" y2="146"/><line x1="310" y1="132" x2="310" y2="146"/><line x1="316" y1="132" x2="316" y2="146"/>
    <line x1="262" y1="154" x2="262" y2="168"/><line x1="268" y1="154" x2="268" y2="168"/><line x1="274" y1="154" x2="274" y2="168"/><line x1="280" y1="154" x2="280" y2="168"/><line x1="286" y1="154" x2="286" y2="168"/><line x1="292" y1="154" x2="292" y2="168"/><line x1="298" y1="154" x2="298" y2="168"/><line x1="304" y1="154" x2="304" y2="168"/><line x1="310" y1="154" x2="310" y2="168"/><line x1="316" y1="154" x2="316" y2="168"/>
    <line x1="262" y1="176" x2="262" y2="190"/><line x1="268" y1="176" x2="268" y2="190"/><line x1="274" y1="176" x2="274" y2="190"/><line x1="280" y1="176" x2="280" y2="190"/><line x1="286" y1="176" x2="286" y2="190"/><line x1="292" y1="176" x2="292" y2="190"/><line x1="298" y1="176" x2="298" y2="190"/><line x1="304" y1="176" x2="304" y2="190"/><line x1="310" y1="176" x2="310" y2="190"/><line x1="316" y1="176" x2="316" y2="190"/>
    <line x1="262" y1="198" x2="262" y2="212"/><line x1="268" y1="198" x2="268" y2="212"/><line x1="274" y1="198" x2="274" y2="212"/><line x1="280" y1="198" x2="280" y2="212"/><line x1="286" y1="198" x2="286" y2="212"/><line x1="292" y1="198" x2="292" y2="212"/><line x1="298" y1="198" x2="298" y2="212"/><line x1="304" y1="198" x2="304" y2="212"/><line x1="310" y1="198" x2="310" y2="212"/><line x1="316" y1="198" x2="316" y2="212"/>
  </g>
  <text x="262" y="58" font-size="11" fill="#e8590c">10 kernels each</text>

  <rect x="20" y="256" width="330" height="54" rx="6" fill="#fff4e6" stroke="#ffd8a8"/>
  <text x="34" y="279" font-weight="600" fill="#212529">148 tensors × ~10 ops ≈ 1,500 launches</text>
  <text x="34" y="298" fill="#495057">most of them on tiny tensors (a 768-value bias)</text>

  <!-- divider -->
  <line x1="380" y1="20" x2="380" y2="310" stroke="#dee2e6"/>

  <!-- right panel: flat buffer -->
  <text x="400" y="28" font-size="15" font-weight="600" fill="#212529">(b) Flat buffer (ours)</text>
  <text x="400" y="46" fill="#495057">one tensor holds every parameter</text>

  <g stroke="#e8590c" stroke-width="2">
    <line x1="400" y1="112" x2="400" y2="126"/><line x1="433" y1="112" x2="433" y2="126"/><line x1="466" y1="112" x2="466" y2="126"/><line x1="499" y1="112" x2="499" y2="126"/><line x1="532" y1="112" x2="532" y2="126"/><line x1="565" y1="112" x2="565" y2="126"/><line x1="598" y1="112" x2="598" y2="126"/><line x1="631" y1="112" x2="631" y2="126"/><line x1="664" y1="112" x2="664" y2="126"/><line x1="697" y1="112" x2="697" y2="126"/>
  </g>
  <text x="400" y="104" font-size="11" fill="#e8590c">10 kernels, each over the whole buffer</text>

  <g>
    <rect x="400" y="134" width="150" height="26" fill="#74c0fc"/>
    <rect x="550" y="134" width="30"  height="26" fill="#a5d8ff"/>
    <rect x="580" y="134" width="80"  height="26" fill="#74c0fc"/>
    <rect x="660" y="134" width="40"  height="26" fill="#a5d8ff"/>
    <rect x="700" y="134" width="12"  height="26" fill="#d0ebff"/>
    <rect x="712" y="134" width="8"   height="26" fill="#e7f5ff"/>
    <rect x="720" y="134" width="20"  height="26" fill="#d0ebff"/>
    <rect x="400" y="134" width="340" height="26" fill="none" stroke="#1c7ed6" stroke-width="1.5"/>
  </g>
  <g font-size="11" fill="#495057">
    <text x="400" y="176">wte</text><text x="552" y="176">wpe</text><text x="582" y="176">matrices</text><text x="700" y="176">1-D</text>
  </g>

  <rect x="400" y="256" width="340" height="54" rx="6" fill="#e7f5ff" stroke="#a5d8ff"/>
  <text x="414" y="279" font-weight="600" fill="#212529">~10 launches per step, for any model</text>
  <text x="414" y="298" fill="#495057">the layers still see their own tensors (views)</text>
</svg>
