<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">LayerNorm's forward for one row: every use of every value</text>
  <text x="20" y="44" fill="#495057">Each arrow is one use, labelled with the forward step that makes it (F) and the backward step that goes back along it (B).</text>
  <text x="20" y="60" fill="#495057">x and d are used twice, so their gradients come in two parts that are added. μ, v and r serve the whole row, so theirs are sums.</text>

  <!-- arrows (drawn first, under the boxes) -->
  <line x1="88" y1="212" x2="152" y2="130" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="100" y="166" text-anchor="end" fill="#212529">F1</text>
  <text x="100" y="181" text-anchor="end" fill="#e8590c" font-weight="600">B9</text>

  <line x1="102" y1="230" x2="256" y2="230" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="222" text-anchor="middle" fill="#212529">F2 · <tspan fill="#e8590c" font-weight="600">B7</tspan></text>

  <line x1="188" y1="130" x2="272" y2="212" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="236" y="160" fill="#212529">F2 · <tspan fill="#e8590c" font-weight="600">B8</tspan></text>

  <line x1="308" y1="212" x2="382" y2="130" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="354" y="186" fill="#212529">F3 · <tspan fill="#e8590c" font-weight="600">B6b</tspan></text>

  <line x1="432" y1="110" x2="486" y2="110" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="459" y="100" text-anchor="middle" fill="#212529">F4 · <tspan fill="#e8590c" font-weight="600">B6a</tspan></text>

  <line x1="538" y1="130" x2="602" y2="212" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="578" y="160" fill="#212529">F5 · <tspan fill="#e8590c" font-weight="600">B5</tspan></text>

  <line x1="322" y1="230" x2="586" y2="230" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="454" y="222" text-anchor="middle" fill="#212529">F5 · <tspan fill="#e8590c" font-weight="600">B4</tspan></text>

  <line x1="652" y1="230" x2="706" y2="230" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="679" y="222" text-anchor="middle" fill="#212529">F6 · <tspan fill="#e8590c" font-weight="600">B3</tspan></text>

  <line x1="700" y1="322" x2="732" y2="250" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="708" y="292" text-anchor="end" fill="#212529">F6 · <tspan fill="#e8590c" font-weight="600">B2</tspan></text>

  <line x1="780" y1="322" x2="748" y2="250" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="772" y="292" fill="#212529">F6 · <tspan fill="#e8590c" font-weight="600">B1</tspan></text>

  <!-- per value: {4, 1024, 768} -->
  <rect x="38" y="212" width="64" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="70" y="236" text-anchor="middle" font-size="16" font-style="italic" fill="#212529">x</text>
  <text x="70" y="266" text-anchor="middle" font-size="11" fill="#868e96">input</text>
  <text x="70" y="281" text-anchor="middle" font-size="11" fill="#e8590c" font-weight="600">used 2×</text>

  <rect x="258" y="212" width="64" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="290" y="236" text-anchor="middle" font-size="16" font-style="italic" fill="#212529">d</text>
  <text x="290" y="266" text-anchor="middle" font-size="11" fill="#868e96">x − μ</text>
  <text x="290" y="281" text-anchor="middle" font-size="11" fill="#e8590c" font-weight="600">used 2×</text>

  <rect x="588" y="212" width="64" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="620" y="236" text-anchor="middle" font-size="16" font-style="italic" fill="#212529">x̂</text>
  <text x="620" y="266" text-anchor="middle" font-size="11" fill="#868e96">d · r (norm)</text>

  <rect x="708" y="212" width="64" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="740" y="236" text-anchor="middle" font-size="16" font-style="italic" fill="#212529">y</text>
  <text x="800" y="235" font-size="11" fill="#868e96">output</text>

  <!-- per row: {4, 1024} -->
  <rect x="138" y="92" width="64" height="36" rx="6" fill="#fff4e6" stroke="#e8590c"/>
  <text x="170" y="116" text-anchor="middle" font-size="16" font-style="italic" fill="#212529">μ</text>
  <text x="170" y="84" text-anchor="middle" font-size="11" fill="#868e96">mean</text>

  <rect x="368" y="92" width="64" height="36" rx="6" fill="#fff4e6" stroke="#e8590c"/>
  <text x="400" y="116" text-anchor="middle" font-size="16" font-style="italic" fill="#212529">v</text>
  <text x="400" y="84" text-anchor="middle" font-size="11" fill="#868e96">variance</text>

  <rect x="488" y="92" width="64" height="36" rx="6" fill="#fff4e6" stroke="#e8590c"/>
  <text x="520" y="116" text-anchor="middle" font-size="16" font-style="italic" fill="#212529">r</text>
  <text x="520" y="84" text-anchor="middle" font-size="11" fill="#868e96">rstd = 1 / √(v + ε)</text>

  <!-- per column: {768} -->
  <rect x="658" y="322" width="64" height="36" rx="6" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="690" y="346" text-anchor="middle" font-size="16" font-style="italic" fill="#212529">γ</text>
  <text x="690" y="374" text-anchor="middle" font-size="11" fill="#868e96">weight</text>

  <rect x="758" y="322" width="64" height="36" rx="6" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="790" y="346" text-anchor="middle" font-size="16" font-style="italic" fill="#212529">β</text>
  <text x="790" y="374" text-anchor="middle" font-size="11" fill="#868e96">bias</text>

  <!-- legend -->
  <rect x="20" y="404" width="18" height="14" rx="3" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="44" y="415" fill="#495057">one per value, {4, 1024, 768}</text>
  <rect x="250" y="404" width="18" height="14" rx="3" fill="#fff4e6" stroke="#e8590c"/>
  <text x="274" y="415" fill="#495057">one per row, {4, 1024}</text>
  <rect x="440" y="404" width="18" height="14" rx="3" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="464" y="415" fill="#495057">one per column, {768}, shared by all rows</text>
</svg>
