<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">One TensorBuffer, five groups: where grad_norm goes</text>
  <text x="20" y="44" fill="#495057">adamw_update loads 4 floats (16 bytes) at a time: params, grads, m and v must each start on a multiple of 16 bytes.</text>
  <text x="20" y="60" fill="#495057">Example: one 2x2 parameter, so 4 values per group; numbers under the bars are byte offsets.</text>

  <!-- first version: grad_norm third -->
  <text x="40" y="92" font-size="13" font-weight="600" fill="#c92a2a">First version: grad_norm third</text>
  <g>
    <rect x="40"  y="100" width="160" height="30" fill="#91a7ff"/>
    <rect x="200" y="100" width="160" height="30" fill="#a5d8ff"/>
    <rect x="360" y="100" width="40"  height="30" fill="#ced4da"/>
    <rect x="400" y="100" width="160" height="30" fill="#ffc9c9"/>
    <rect x="560" y="100" width="160" height="30" fill="#ffc9c9"/>
    <rect x="40"  y="100" width="680" height="30" fill="none" stroke="#495057"/>
    <line x1="200" y1="100" x2="200" y2="130" stroke="#495057"/><line x1="360" y1="100" x2="360" y2="130" stroke="#495057"/>
    <line x1="400" y1="100" x2="400" y2="130" stroke="#495057"/><line x1="560" y1="100" x2="560" y2="130" stroke="#495057"/>
  </g>
  <g font-size="12" fill="#212529" text-anchor="middle">
    <text x="120" y="119">params</text><text x="280" y="119">grads</text><text x="380" y="119">norm</text>
    <text x="480" y="119">m</text><text x="640" y="119">v</text>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="40" y="146" fill="#495057">0</text><text x="200" y="146" fill="#495057">16</text><text x="360" y="146" fill="#495057">32</text>
    <text x="400" y="146" fill="#c92a2a" font-weight="600">36</text><text x="560" y="146" fill="#c92a2a" font-weight="600">52</text>
  </g>
  <text x="40" y="168" font-size="12" fill="#c92a2a">m and v start 4 bytes off a multiple of 16: "CUDA error: misaligned address", reported later, at PyTorch's next copy.</text>

  <!-- final: grad_norm last -->
  <text x="40" y="208" font-size="13" font-weight="600" fill="#2b8a3e">Final: grad_norm last (Optimizer::allocate adds it after the algorithm's groups)</text>
  <g>
    <rect x="40"  y="216" width="160" height="30" fill="#91a7ff"/>
    <rect x="200" y="216" width="160" height="30" fill="#a5d8ff"/>
    <rect x="360" y="216" width="160" height="30" fill="#b2f2bb"/>
    <rect x="520" y="216" width="160" height="30" fill="#b2f2bb"/>
    <rect x="680" y="216" width="40"  height="30" fill="#ced4da"/>
    <rect x="40"  y="216" width="680" height="30" fill="none" stroke="#495057"/>
    <line x1="200" y1="216" x2="200" y2="246" stroke="#495057"/><line x1="360" y1="216" x2="360" y2="246" stroke="#495057"/>
    <line x1="520" y1="216" x2="520" y2="246" stroke="#495057"/><line x1="680" y1="216" x2="680" y2="246" stroke="#495057"/>
  </g>
  <g font-size="12" fill="#212529" text-anchor="middle">
    <text x="120" y="235">params</text><text x="280" y="235">grads</text><text x="440" y="235">m</text>
    <text x="600" y="235">v</text><text x="700" y="235">norm</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#2b8a3e">
    <text x="40" y="262">0</text><text x="200" y="262">16</text><text x="360" y="262">32</text><text x="520" y="262">48</text><text x="680" y="262">64</text>
  </g>
  <text x="40" y="284" font-size="12" fill="#2b8a3e">Every group the kernel reads starts on 16 bytes. grad_norm is read as one float, so its place does not matter.</text>

  <text x="20" y="318" font-size="11" fill="#868e96">Groups 0 to 4 are params, grads, m, v, grad_norm; buffer.group(g) gives each as one flat tensor, so one launch covers a whole group.</text>
</svg>
