<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
  </defs>
  <rect width="860" height="450" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">A linear layer's forward for one row: every use of every value</text>
  <text x="20" y="44" fill="#495057">Each arrow is one use, labelled with the forward step that makes it (F) and the backward step that goes back along it (B).</text>
  <text x="20" y="60" fill="#495057">Dashed: the same uses for the other outputs j and inputs i. W and b serve every row, so their gradients also sum over the rows.</text>
  <rect x="40" y="196" width="80" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="80" y="219" text-anchor="middle" font-size="16" font-style="italic" fill="#212529"><tspan>x</tspan><tspan dy="4" font-size="0.72em">i</tspan></text>
  <rect x="250" y="196" width="80" height="36" rx="6" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="290" y="219" text-anchor="middle" font-size="16" font-style="italic" fill="#212529"><tspan>p</tspan><tspan dy="4" font-size="0.72em">j,i</tspan></text>
  <rect x="480" y="196" width="80" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="520" y="219" text-anchor="middle" font-size="16" font-style="italic" fill="#212529"><tspan>z</tspan><tspan dy="4" font-size="0.72em">j</tspan></text>
  <rect x="700" y="196" width="80" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="740" y="219" text-anchor="middle" font-size="16" font-style="italic" fill="#212529"><tspan>y</tspan><tspan dy="4" font-size="0.72em">j</tspan></text>
  <text x="80" y="248" text-anchor="middle" font-size="11" fill="#868e96">input</text>
  <text x="290" y="248" text-anchor="middle" font-size="11" fill="#868e96">product</text>
  <text x="520" y="188" text-anchor="middle" font-size="11" fill="#868e96">dot product</text>
  <text x="740" y="248" text-anchor="middle" font-size="11" fill="#868e96">output</text>
  <rect x="250" y="100" width="80" height="36" rx="6" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="290" y="123" text-anchor="middle" font-size="16" font-style="italic" fill="#212529"><tspan>W</tspan><tspan dy="4" font-size="0.72em">j,i</tspan></text>
  <rect x="700" y="100" width="80" height="36" rx="6" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="740" y="123" text-anchor="middle" font-size="16" font-style="italic" fill="#212529"><tspan>b</tspan><tspan dy="4" font-size="0.72em">j</tspan></text>
  <text x="290" y="92" text-anchor="middle" font-size="11" fill="#868e96">weight, the same in every row</text>
  <text x="740" y="92" text-anchor="middle" font-size="11" fill="#868e96">bias, the same in every row</text>
  <line x1="120" y1="214" x2="248" y2="214" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="184" y="206" text-anchor="middle" fill="#212529">F1 · <tspan fill="#e8590c" font-weight="600">B5</tspan></text>
  <line x1="290" y1="136" x2="290" y2="194" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="298" y="170" text-anchor="start" fill="#212529">F1 · <tspan fill="#e8590c" font-weight="600">B4</tspan></text>
  <line x1="330" y1="214" x2="478" y2="214" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="206" text-anchor="middle" fill="#212529">F2 · <tspan fill="#e8590c" font-weight="600">B3</tspan></text>
  <line x1="560" y1="214" x2="698" y2="214" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="629" y="206" text-anchor="middle" fill="#212529">F3 · <tspan fill="#e8590c" font-weight="600">B2</tspan></text>
  <line x1="740" y1="136" x2="740" y2="194" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="748" y="170" text-anchor="start" fill="#212529">F3 · <tspan fill="#e8590c" font-weight="600">B1</tspan></text>
  <rect x="150" y="300" width="80" height="36" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="190" y="323" text-anchor="middle" font-size="14" font-style="italic" fill="#868e96"><tspan>p</tspan><tspan dy="4" font-size="0.72em">1,i</tspan></text>
  <rect x="270" y="300" width="80" height="36" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="310" y="323" text-anchor="middle" font-size="14" font-style="italic" fill="#868e96"><tspan>p</tspan><tspan dy="4" font-size="0.72em">out,i</tspan></text>
  <text x="250" y="323" text-anchor="middle" fill="#868e96">…</text>
  <line x1="96" y1="232" x2="180" y2="298" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-light)"/>
  <line x1="112" y1="232" x2="296" y2="298" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-light)"/>
  <text x="230" y="358" text-anchor="middle" font-size="12" fill="#495057"><tspan>x</tspan><tspan dy="4" font-size="0.72em">i</tspan><tspan dy="-4"> is in n</tspan><tspan dy="4" font-size="0.72em">out</tspan><tspan dy="-4"> products, one per output j:</tspan></text>
  <text x="230" y="374" text-anchor="middle" font-size="12" fill="#495057">its gradient is a sum over j (B5)</text>
  <rect x="440" y="300" width="80" height="36" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="480" y="323" text-anchor="middle" font-size="14" font-style="italic" fill="#868e96"><tspan>p</tspan><tspan dy="4" font-size="0.72em">j,1</tspan></text>
  <rect x="560" y="300" width="80" height="36" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="600" y="323" text-anchor="middle" font-size="14" font-style="italic" fill="#868e96"><tspan>p</tspan><tspan dy="4" font-size="0.72em">j,in</tspan></text>
  <text x="540" y="323" text-anchor="middle" fill="#868e96">…</text>
  <line x1="486" y1="298" x2="506" y2="234" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-light)"/>
  <line x1="594" y1="298" x2="540" y2="234" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-light)"/>
  <text x="540" y="358" text-anchor="middle" font-size="12" fill="#495057"><tspan>z</tspan><tspan dy="4" font-size="0.72em">j</tspan><tspan dy="-4"> adds n</tspan><tspan dy="4" font-size="0.72em">in</tspan><tspan dy="-4"> products, one per input i:</tspan></text>
  <text x="540" y="374" text-anchor="middle" font-size="12" fill="#495057">each gets the same gradient (B3)</text>
  <rect x="20" y="404" width="18" height="14" rx="3" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="44" y="415" fill="#495057">one per value: x {4, 1024, 768}; z, y {4, 1024, 2304}</text>
  <rect x="420" y="404" width="18" height="14" rx="3" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="444" y="415" fill="#495057">one per product: never stored</text>
  <rect x="650" y="404" width="18" height="14" rx="3" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="674" y="415" fill="#495057">shared by all rows</text>
  <text x="20" y="438" font-size="11" fill="#868e96"><tspan>Shapes for the qkv layer: n</tspan><tspan dy="4" font-size="0.72em">in</tspan><tspan dy="-4"> = 768, n</tspan><tspan dy="4" font-size="0.72em">out</tspan><tspan dy="-4"> = 2304. In the dashed boxes, "out" and "in" stand for n</tspan><tspan dy="4" font-size="0.72em">out</tspan><tspan dy="-4"> and n</tspan><tspan dy="4" font-size="0.72em">in</tspan><tspan dy="-4">.</tspan></text>
</svg>
