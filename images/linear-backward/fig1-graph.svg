<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
  </defs>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">A linear layer's forward for one row: every use of every value</text>
  <text x="20" y="44" fill="#495057">Each arrow is one use, labelled with the forward step that makes it (F) and the backward step that goes back along it (B).</text>
  <text x="20" y="60" fill="#495057">Dashed: the other outputs that use the same input, and the other terms of the same output. W and b are used again in every row.</text>
  <rect x="60" y="200" width="80" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="100" y="223" text-anchor="middle" font-size="16" font-style="italic" fill="#212529"><tspan>x</tspan><tspan dy="4" font-size="0.72em">i</tspan></text>
  <rect x="260" y="100" width="80" height="36" rx="6" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="300" y="123" text-anchor="middle" font-size="16" font-style="italic" fill="#212529"><tspan>W</tspan><tspan dy="4" font-size="0.72em">j,i</tspan></text>
  <rect x="640" y="100" width="80" height="36" rx="6" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="680" y="123" text-anchor="middle" font-size="16" font-style="italic" fill="#212529"><tspan>b</tspan><tspan dy="4" font-size="0.72em">j</tspan></text>
  <rect x="450" y="200" width="80" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="490" y="223" text-anchor="middle" font-size="16" font-style="italic" fill="#212529"><tspan>y</tspan><tspan dy="4" font-size="0.72em">j</tspan></text>
  <text x="100" y="252" text-anchor="middle" font-size="11" fill="#868e96">input</text>
  <text x="300" y="92" text-anchor="middle" font-size="11" fill="#868e96">weight, the same in every row</text>
  <text x="680" y="92" text-anchor="middle" font-size="11" fill="#868e96">bias, the same in every row</text>
  <text x="490" y="192" text-anchor="middle" font-size="11" fill="#868e96">output</text>
  <line x1="140" y1="218" x2="448" y2="218" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="210" text-anchor="middle" fill="#212529">F1 · <tspan fill="#e8590c" font-weight="600">B3</tspan></text>
  <line x1="316" y1="136" x2="462" y2="198" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="158" text-anchor="start" fill="#212529">F1 · <tspan fill="#e8590c" font-weight="600">B2</tspan></text>
  <line x1="664" y1="136" x2="518" y2="198" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="178" text-anchor="start" fill="#212529">F1 · <tspan fill="#e8590c" font-weight="600">B1</tspan></text>
  <rect x="170" y="300" width="80" height="36" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="210" y="323" text-anchor="middle" font-size="14" font-style="italic" fill="#868e96"><tspan>y</tspan><tspan dy="4" font-size="0.72em">1</tspan></text>
  <rect x="290" y="300" width="80" height="36" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="330" y="323" text-anchor="middle" font-size="14" font-style="italic" fill="#868e96"><tspan>y</tspan><tspan dy="4" font-size="0.72em">out</tspan></text>
  <text x="270" y="323" text-anchor="middle" fill="#868e96">…</text>
  <line x1="112" y1="236" x2="200" y2="298" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-light)"/>
  <line x1="128" y1="236" x2="316" y2="298" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-light)"/>
  <text x="250" y="358" text-anchor="middle" font-size="12" fill="#495057"><tspan>x</tspan><tspan dy="4" font-size="0.72em">i</tspan><tspan dy="-4"> is in every output of its row,</tspan></text>
  <text x="250" y="374" text-anchor="middle" font-size="12" fill="#495057"><tspan>n</tspan><tspan dy="4" font-size="0.72em">out</tspan><tspan dy="-4"> in all: dx is a sum over j (B3)</tspan></text>
  <rect x="480" y="300" width="100" height="36" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="530" y="323" text-anchor="middle" font-size="14" font-style="italic" fill="#868e96"><tspan>x</tspan><tspan dy="4" font-size="0.72em">1</tspan><tspan dy="-4"> W</tspan><tspan dy="4" font-size="0.72em">j,1</tspan></text>
  <rect x="620" y="300" width="100" height="36" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="670" y="323" text-anchor="middle" font-size="14" font-style="italic" fill="#868e96"><tspan>x</tspan><tspan dy="4" font-size="0.72em">in</tspan><tspan dy="-4"> W</tspan><tspan dy="4" font-size="0.72em">j,in</tspan></text>
  <text x="600" y="323" text-anchor="middle" fill="#868e96">…</text>
  <line x1="520" y1="298" x2="494" y2="238" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-light)"/>
  <line x1="660" y1="298" x2="520" y2="238" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-light)"/>
  <text x="600" y="358" text-anchor="middle" font-size="12" fill="#495057"><tspan>y</tspan><tspan dy="4" font-size="0.72em">j</tspan><tspan dy="-4"> adds n</tspan><tspan dy="4" font-size="0.72em">in</tspan><tspan dy="-4"> terms, one per input i:</tspan></text>
  <text x="600" y="374" text-anchor="middle" font-size="12" fill="#495057"><tspan>only one holds x</tspan><tspan dy="4" font-size="0.72em">i</tspan><tspan dy="-4">, and only one W</tspan><tspan dy="4" font-size="0.72em">j,i</tspan></text>
  <rect x="20" y="398" width="18" height="14" rx="3" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="44" y="409" fill="#495057">one per value: x {4, 1024, 768}, y {4, 1024, 2304}</text>
  <rect x="420" y="398" width="18" height="14" rx="3" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="444" y="409" fill="#495057">shared by all rows: W {2304, 768}, b {2304}</text>
  <text x="20" y="430" font-size="11" fill="#868e96"><tspan>Shapes for the qkv layer: n</tspan><tspan dy="4" font-size="0.72em">in</tspan><tspan dy="-4"> = 768, n</tspan><tspan dy="4" font-size="0.72em">out</tspan><tspan dy="-4"> = 2304. In the dashed boxes, "out" and "in" stand for n</tspan><tspan dy="4" font-size="0.72em">out</tspan><tspan dy="-4"> and n</tspan><tspan dy="4" font-size="0.72em">in</tspan><tspan dy="-4">.</tspan></text>
</svg>
