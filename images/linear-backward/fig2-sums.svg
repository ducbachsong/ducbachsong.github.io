  <rect width="860" height="350" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">Where the sums run, in the example of Section 1.3</text>
  <text x="20" y="44" fill="#495057">Each grid is the output y: 2 rows (t) by 4 output columns (j). The coloured cells are the outputs the value above goes into.</text>
  <text x="20" y="60" fill="#495057">Each coloured cell is one path to the loss, so the value's gradient is a sum with one term per coloured cell.</text>
  <text x="160" y="92" text-anchor="middle" fill="#495057">(a) an input value</text>
  <rect x="105" y="104" width="110" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
