  <text x="138" y="240" text-anchor="middle" fill="#868e96">26</text>
  <rect x="160" y="220" width="44" height="30" fill="#f8f9fa" stroke="#ced4da"/>
  <text x="182" y="240" text-anchor="middle" fill="#868e96">56</text>
