  <line x1="160" y1="138" x2="160" y2="186" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="72" y="190" width="44" height="30" fill="#e7f5ff" stroke="#1971c2"/>
