  <text x="160" y="290" text-anchor="middle" fill="#495057">every output of its row: 4 uses</text>
  <text x="160" y="314" text-anchor="middle" font-size="14" fill="#212529"><tspan>dx</tspan><tspan dy="4" font-size="0.72em">1,2</tspan><tspan dy="-4"> = Σ</tspan><tspan dy="4" font-size="0.72em">j</tspan><tspan dy="-4"> dy</tspan><tspan dy="4" font-size="0.72em">1,j</tspan><tspan dy="-4"> W</tspan><tspan dy="4" font-size="0.72em">j,2</tspan></text>
  <text x="160" y="334" text-anchor="middle" font-size="12" fill="#495057">B3: a sum over j, the output columns</text>
