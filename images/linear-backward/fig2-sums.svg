  <text x="440" y="290" text-anchor="middle" fill="#495057">output 3 of every row: 2 uses</text>
  <text x="440" y="314" text-anchor="middle" font-size="14" fill="#212529"><tspan>dW</tspan><tspan dy="4" font-size="0.72em">3,2</tspan><tspan dy="-4"> = Σ</tspan><tspan dy="4" font-size="0.72em">t</tspan><tspan dy="-4"> dy</tspan><tspan dy="4" font-size="0.72em">t,3</tspan><tspan dy="-4"> x</tspan><tspan dy="4" font-size="0.72em">t,2</tspan></text>
