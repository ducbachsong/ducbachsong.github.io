  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">Adding inside a warp: __shfl_xor_sync, every lane in every step</text>
  <text x="20" y="44" fill="#495057">8 lanes holding 1 … 8 (a real warp has 32 and starts at offset 16). Each step, lane i adds the value of lane i XOR offset,</text>
  <text x="20" y="60" fill="#495057">read straight from that lane's register: grey line = its own value, orange line = its partner's.</text>
