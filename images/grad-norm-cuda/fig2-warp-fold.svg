  <text x="641" y="323" font-size="11" fill="#868e96">1: the sum,</text>
  <text x="641" y="337" font-size="11" fill="#868e96">in every lane</text>
  <text x="165" y="360" text-anchor="middle" font-size="10" fill="#868e96">lane 0</text>
  <text x="227" y="360" text-anchor="middle" font-size="10" fill="#868e96">lane 1</text>
  <text x="289" y="360" text-anchor="middle" font-size="10" fill="#868e96">lane 2</text>
  <text x="351" y="360" text-anchor="middle" font-size="10" fill="#868e96">lane 3</text>
  <text x="413" y="360" text-anchor="middle" font-size="10" fill="#868e96">lane 4</text>
  <text x="475" y="360" text-anchor="middle" font-size="10" fill="#868e96">lane 5</text>
  <text x="537" y="360" text-anchor="middle" font-size="10" fill="#868e96">lane 6</text>
  <text x="599" y="360" text-anchor="middle" font-size="10" fill="#868e96">lane 7</text>
  <text x="20" y="390" font-size="11" fill="#495057">Example, offset 4: lane 1 adds lane 5 (2 + 6 = 8) and lane 5 adds lane 1 (6 + 2 = 8). The 8 lanes still add 8 times per step, but the</text>
  <text x="20" y="404" font-size="11" fill="#495057">number of different sums halves: 8 → 4 → 2 → 1. A warp runs each instruction for its 32 lanes together, so the repeated sums cost nothing.</text>
  <text x="20" y="430" font-size="11" fill="#868e96">32 lanes: offsets 16, 8, 4, 2, 1, so 5 steps for 32 values. The kernel then keeps the result of one lane (lane 0) and ignores the copies.</text>
