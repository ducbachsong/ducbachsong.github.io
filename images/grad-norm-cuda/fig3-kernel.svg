<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="760" height="600" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">compute_grad_norm_kernel: 124,439,808 squares down to one number, in one launch</text>
  <text x="20" y="44" fill="#495057">Box colour = where the numbers live. Each arrow is one stage of the kernel; the count on the right is how many numbers are left.</text>

  <!-- 1: grads -->
  <rect x="60" y="62" width="520" height="34" fill="#a5d8ff" stroke="#495057"/>
  <text x="320" y="84" text-anchor="middle" fill="#212529">grads: the whole model's gradients, one flat view</text>
  <text x="600" y="84" font-weight="600" fill="#212529">124,439,808</text>
  <line x1="320" y1="96" x2="320" y2="128" stroke="#495057" marker-end="url(#arrow)"/>
  <text x="332" y="112" font-size="11" fill="#495057">step 1: each thread reads 59–60 float4s (grid stride) and adds their squares</text>

  <!-- 2: thread sums -->
  <rect x="60" y="130" width="520" height="34" fill="#ffd8a8" stroke="#495057"/>
  <text x="320" y="152" text-anchor="middle" fill="#212529">sum: one per thread, in its register</text>
  <text x="600" y="152" font-weight="600" fill="#212529">524,288</text>
  <line x1="320" y1="164" x2="320" y2="196" stroke="#495057" marker-end="url(#arrow)"/>
  <text x="332" y="180" font-size="11" fill="#495057">step 2, round 1: each warp folds its 32 sums with 5 shuffles; lane 0 writes the total</text>

  <!-- 3: warp totals -->
  <rect x="60" y="198" width="520" height="34" fill="#b2f2bb" stroke="#495057"/>
  <text x="320" y="220" text-anchor="middle" fill="#212529">warp_totals[32]: one array per block, shared by its 1024 threads</text>
  <text x="600" y="220" font-weight="600" fill="#212529">16,384</text>
  <text x="600" y="234" font-size="10" fill="#868e96">(32 per block)</text>
  <line x1="320" y1="232" x2="320" y2="264" stroke="#495057" marker-end="url(#arrow)"/>
  <text x="332" y="248" font-size="11" fill="#495057">__syncthreads(); round 2: lane k reads warp_totals[k], each warp folds the 32</text>

  <!-- 4: block totals -->
  <rect x="60" y="266" width="520" height="34" fill="#ffd8a8" stroke="#495057"/>
  <text x="320" y="288" text-anchor="middle" fill="#212529">block_total: every thread of the block holds the same number</text>
  <text x="600" y="288" font-weight="600" fill="#212529">512</text>
  <text x="600" y="302" font-size="10" fill="#868e96">(one per block)</text>
  <line x1="320" y1="300" x2="320" y2="332" stroke="#495057" marker-end="url(#arrow)"/>
  <text x="332" y="316" font-size="11" fill="#495057">thread 0: write block_sums[blockIdx.x], __threadfence(), atomicAdd(counter, 1)</text>

  <!-- 5: block sums + counter -->
  <rect x="60" y="334" width="400" height="34" fill="#a5d8ff" stroke="#495057"/>
  <text x="260" y="356" text-anchor="middle" fill="#212529">block_sums row 0: 512 values in the flat buffer</text>
  <rect x="460" y="334" width="120" height="34" fill="#74c0fc" stroke="#495057"/>
  <text x="520" y="350" text-anchor="middle" font-size="11" fill="#212529">row 1, value 0:</text>
  <text x="520" y="363" text-anchor="middle" font-size="11" fill="#212529">blocks done</text>
  <text x="600" y="356" font-weight="600" fill="#212529">512</text>

  <!-- branch -->
  <line x1="200" y1="368" x2="140" y2="408" stroke="#495057" marker-end="url(#arrow)"/>
  <text x="40" y="424" font-size="11" fill="#868e96">511 blocks: count before &lt; 511</text>
  <text x="40" y="438" font-size="11" fill="#868e96">→ return (their sums stay in memory)</text>
  <line x1="320" y1="368" x2="380" y2="408" stroke="#e8590c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="392" y="400" font-size="11" fill="#e8590c">the last block: count before = 511 → step 3</text>

  <!-- 6: last block reads -->
  <rect x="260" y="410" width="320" height="34" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.6"/>
  <text x="420" y="426" text-anchor="middle" font-size="12" fill="#212529">total: threads 0–511 take block_sums[threadIdx.x],</text>
  <text x="420" y="439" text-anchor="middle" font-size="12" fill="#212529">threads 512–1023 take 0 (volatile reads)</text>
  <text x="600" y="432" font-weight="600" fill="#212529">1024</text>
  <line x1="420" y1="444" x2="420" y2="476" stroke="#495057" marker-end="url(#arrow)"/>
  <text x="432" y="460" font-size="11" fill="#495057">the same two rounds again</text>

  <!-- 7: result -->
  <rect x="260" y="478" width="320" height="34" fill="#a5d8ff" stroke="#495057"/>
  <text x="420" y="500" text-anchor="middle" fill="#212529">grad_norm = sqrt(total); counter = 0</text>
  <text x="600" y="500" font-weight="600" fill="#212529">1</text>

  <!-- legend -->
  <rect x="40" y="536" width="16" height="12" fill="#a5d8ff" stroke="#495057"/><text x="62" y="546" font-size="11" fill="#495057">GPU memory: every block can read it; stays after a block ends</text>
  <rect x="420" y="536" width="16" height="12" fill="#ffd8a8" stroke="#495057"/><text x="442" y="546" font-size="11" fill="#495057">registers: one thread's own</text>
  <rect x="40" y="558" width="16" height="12" fill="#b2f2bb" stroke="#495057"/><text x="62" y="568" font-size="11" fill="#495057">shared memory: one copy per block, on the chip</text>
  <text x="420" y="568" font-size="11" fill="#495057">Waiting: __syncthreads() within a block;</text>
  <text x="420" y="582" font-size="11" fill="#495057">across blocks, only the counter.</text>
</svg>
