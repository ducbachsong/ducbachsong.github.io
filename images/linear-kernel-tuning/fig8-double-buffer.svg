<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="860" height="490" fill="#ffffff"/>
  <text x="20.0" y="28.0" font-size="15" text-anchor="start" fill="#212529" font-weight="600">A block's steps in time: one set of pieces, or two</text>
  <text x="20.0" y="48.0" font-size="13" text-anchor="start" fill="#495057">Not to scale: a step's math is about 2,000 cycles for one block alone; a read from GPU memory about 300.</text>
  <text x="20.0" y="96.0" font-size="13" text-anchor="start" fill="#212529" font-weight="600">(a) one set (before runs 8 and 9): each step waits for its read, and needs 2 syncs</text>
  <text x="150.0" y="128.0" font-size="12" text-anchor="end" fill="#495057">GPU memory</text>
  <line x1="160.0" y1="123.0" x2="840.0" y2="123.0" stroke="#f1f3f5" stroke-width="1"/>
  <text x="150.0" y="162.0" font-size="12" text-anchor="end" fill="#495057">shared memory</text>
  <line x1="160.0" y1="157.0" x2="840.0" y2="157.0" stroke="#f1f3f5" stroke-width="1"/>
  <text x="150.0" y="196.0" font-size="12" text-anchor="end" fill="#495057">math units</text>
  <line x1="160.0" y1="191.0" x2="840.0" y2="191.0" stroke="#f1f3f5" stroke-width="1"/>
  <rect x="160.0" y="110.0" width="90.0" height="26.0" rx="3" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="205.0" y="127.0" font-size="10.5" text-anchor="middle" fill="#212529">read step 0</text>
  <rect x="250.0" y="144.0" width="60.0" height="26.0" rx="3" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="280.0" y="161.0" font-size="10.5" text-anchor="middle" fill="#212529">store</text>
  <rect x="320.0" y="178.0" width="180.0" height="26.0" rx="3" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="410.0" y="195.0" font-size="10.5" text-anchor="middle" fill="#212529">math, step 0</text>
  <rect x="510.0" y="110.0" width="90.0" height="26.0" rx="3" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="555.0" y="127.0" font-size="10.5" text-anchor="middle" fill="#212529">read step 1</text>
  <rect x="600.0" y="144.0" width="60.0" height="26.0" rx="3" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="630.0" y="161.0" font-size="10.5" text-anchor="middle" fill="#212529">store</text>
  <rect x="670.0" y="178.0" width="150.0" height="26.0" rx="3" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="745.0" y="195.0" font-size="10.5" text-anchor="middle" fill="#212529">math, step 1</text>
  <line x1="315.0" y1="104.0" x2="315.0" y2="208.0" stroke="#e03131" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="505.0" y1="104.0" x2="505.0" y2="208.0" stroke="#e03131" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="665.0" y1="104.0" x2="665.0" y2="208.0" stroke="#e03131" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="315.0" y="222.0" font-size="10.5" text-anchor="middle" fill="#e03131">__syncthreads()</text>
  <text x="835.0" y="195.0" font-size="13" text-anchor="end" fill="#868e96">…</text>
  <text x="20.0" y="246.0" font-size="13" text-anchor="start" fill="#212529" font-weight="600">(b) two sets (now): the next read runs during this step's math; 1 sync per step</text>
  <text x="150.0" y="278.0" font-size="12" text-anchor="end" fill="#495057">GPU memory</text>
  <line x1="160.0" y1="273.0" x2="840.0" y2="273.0" stroke="#f1f3f5" stroke-width="1"/>
  <text x="150.0" y="312.0" font-size="12" text-anchor="end" fill="#495057">shared memory</text>
  <line x1="160.0" y1="307.0" x2="840.0" y2="307.0" stroke="#f1f3f5" stroke-width="1"/>
  <text x="150.0" y="346.0" font-size="12" text-anchor="end" fill="#495057">math units</text>
  <line x1="160.0" y1="341.0" x2="840.0" y2="341.0" stroke="#f1f3f5" stroke-width="1"/>
  <rect x="160.0" y="260.0" width="90.0" height="26.0" rx="3" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="205.0" y="277.0" font-size="10.5" text-anchor="middle" fill="#212529">read step 0</text>
  <rect x="250.0" y="294.0" width="66.0" height="26.0" rx="3" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="283.0" y="311.0" font-size="10.5" text-anchor="middle" fill="#212529">store set A</text>
  <rect x="325.0" y="260.0" width="90.0" height="26.0" rx="3" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="370.0" y="277.0" font-size="10.5" text-anchor="middle" fill="#212529">read step 1</text>
  <rect x="325.0" y="328.0" width="175.0" height="26.0" rx="3" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="412.5" y="345.0" font-size="10.5" text-anchor="middle" fill="#212529">math, step 0, set A</text>
  <rect x="500.0" y="294.0" width="66.0" height="26.0" rx="3" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="533.0" y="311.0" font-size="10.5" text-anchor="middle" fill="#212529">store set B</text>
  <rect x="575.0" y="260.0" width="90.0" height="26.0" rx="3" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="620.0" y="277.0" font-size="10.5" text-anchor="middle" fill="#212529">read step 2</text>
  <rect x="575.0" y="328.0" width="175.0" height="26.0" rx="3" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="662.5" y="345.0" font-size="10.5" text-anchor="middle" fill="#212529">math, step 1, set B</text>
  <rect x="750.0" y="294.0" width="66.0" height="26.0" rx="3" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="783.0" y="311.0" font-size="10.5" text-anchor="middle" fill="#212529">store set A</text>
  <line x1="320.0" y1="254.0" x2="320.0" y2="358.0" stroke="#e03131" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="570.0" y1="254.0" x2="570.0" y2="358.0" stroke="#e03131" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="820.0" y1="254.0" x2="820.0" y2="358.0" stroke="#e03131" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="320.0" y="372.0" font-size="10.5" text-anchor="middle" fill="#e03131">__syncthreads()</text>
  <text x="835.0" y="345.0" font-size="13" text-anchor="end" fill="#868e96">…</text>
  <text x="20.0" y="404.0" font-size="12.5" text-anchor="start" fill="#495057">In (b), right after a step's sync, each thread asks GPU memory for its 2 float4 of the next step and keeps going: the math</text>
  <text x="20.0" y="424.0" font-size="12.5" text-anchor="start" fill="#495057">needs only the set that is already in shared memory. When the math is done, the values have arrived, and go into the other</text>
  <text x="20.0" y="444.0" font-size="12.5" text-anchor="start" fill="#495057">set, which no one reads any more. Cost: a second set (16.5 KB of shared memory for both) and 8 registers to hold the 2 float4.</text>
  <text x="20.0" y="464.0" font-size="12.5" text-anchor="start" fill="#495057">ncu: the wait for GPU memory went from 0.71 to 0.02 cycles per instruction in dW's kernel.</text>
</svg>
