<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="20" y="26" text-anchor="start" font-size="15" font-weight="600" fill="#212529">Two ways to work out y = x · Wᵀ, on the example of Section 1.3</text>
  <text x="20" y="44" text-anchor="start" fill="#495057">x is 2 × 3, Wᵀ is 3 × 2, y is 2 × 2. Both ways do the same 12 multiply-adds: 4 outputs, 3 products each.</text>
  <text x="20" y="76" text-anchor="start" font-weight="600" fill="#212529">(a) Inner products: one output at a time. A row of x times a column of Wᵀ gives one number.</text>
  <text x="94" y="112" text-anchor="middle" fill="#212529">x</text>
  <rect x="40" y="120" width="36" height="30" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="58" y="140" text-anchor="middle" fill="#212529">1</text>
  <rect x="76" y="120" width="36" height="30" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="94" y="140" text-anchor="middle" fill="#212529">2</text>
  <rect x="112" y="120" width="36" height="30" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="130" y="140" text-anchor="middle" fill="#212529">3</text>
  <rect x="40" y="150" width="36" height="30" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="58" y="170" text-anchor="middle" fill="#868e96">4</text>
  <rect x="76" y="150" width="36" height="30" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="94" y="170" text-anchor="middle" fill="#868e96">5</text>
  <rect x="112" y="150" width="36" height="30" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="130" y="170" text-anchor="middle" fill="#868e96">6</text>
  <text x="167" y="156" text-anchor="middle" font-size="20" fill="#212529">·</text>
  <text x="222" y="97" text-anchor="middle" fill="#212529">Wᵀ</text>
  <rect x="186" y="105" width="36" height="30" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="204" y="125" text-anchor="middle" fill="#212529">1</text>
  <rect x="222" y="105" width="36" height="30" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="240" y="125" text-anchor="middle" fill="#868e96">3</text>
  <rect x="186" y="135" width="36" height="30" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="204" y="155" text-anchor="middle" fill="#212529">0</text>
  <rect x="222" y="135" width="36" height="30" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="240" y="155" text-anchor="middle" fill="#868e96">1</text>
  <rect x="186" y="165" width="36" height="30" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="204" y="185" text-anchor="middle" fill="#212529">2</text>
  <rect x="222" y="165" width="36" height="30" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="240" y="185" text-anchor="middle" fill="#868e96">0</text>
  <text x="278" y="156" text-anchor="middle" font-size="18" fill="#212529">=</text>
  <text x="334" y="112" text-anchor="middle" fill="#212529">y</text>
  <rect x="298" y="120" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="316" y="140" text-anchor="middle" fill="#212529">7</text>
  <rect x="334" y="120" width="36" height="30" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="352" y="140" text-anchor="middle" fill="#868e96">5</text>
  <rect x="298" y="150" width="36" height="30" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="316" y="170" text-anchor="middle" fill="#868e96">16</text>
  <rect x="334" y="150" width="36" height="30" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="352" y="170" text-anchor="middle" fill="#868e96">17</text>
  <text x="400" y="132" text-anchor="start" font-size="14" fill="#212529"><tspan>y</tspan><tspan dy="4" font-size="0.72em">1,1</tspan><tspan dy="-4"> = 1·1 + 2·0 + 3·2 = 7</tspan></text>
  <text x="400" y="154" text-anchor="start" fill="#495057">i is the innermost loop: a whole row and a whole column</text>
  <text x="400" y="172" text-anchor="start" fill="#495057">are read for one output. 3 + 3 values read, 3 multiply-adds.</text>
  <text x="400" y="190" text-anchor="start" fill="#495057">Then the next output, 4 rounds in all.</text>
  <line x1="20" y1="215" x2="840" y2="215" stroke="#dee2e6"/>
  <text x="20" y="240" text-anchor="start" font-weight="600" fill="#212529">(b) Outer products: one i at a time. A column of x times a row of Wᵀ gives a whole grid.</text>
  <text x="20" y="258" text-anchor="start" fill="#495057">Every value of the column is multiplied by every value of the row. One grid per i, then the grids are added.</text>
  <rect x="86" y="280" width="36" height="30" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="104" y="300" text-anchor="middle" fill="#212529">1</text>
  <rect x="122" y="280" width="36" height="30" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="140" y="300" text-anchor="middle" fill="#212529">3</text>
  <rect x="40" y="318" width="36" height="30" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="58" y="338" text-anchor="middle" fill="#212529">1</text>
  <rect x="40" y="348" width="36" height="30" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="58" y="368" text-anchor="middle" fill="#212529">4</text>
  <rect x="86" y="318" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="104" y="338" text-anchor="middle" fill="#212529">1</text>
  <rect x="122" y="318" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="140" y="338" text-anchor="middle" fill="#212529">3</text>
  <rect x="86" y="348" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="104" y="368" text-anchor="middle" fill="#212529">4</text>
  <rect x="122" y="348" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="140" y="368" text-anchor="middle" fill="#212529">12</text>
  <text x="122" y="400" text-anchor="middle" fill="#212529">i = 1</text>
  <text x="58" y="306" text-anchor="middle" font-size="12" fill="#495057">x</text>
  <text x="172" y="300" text-anchor="start" font-size="12" fill="#495057">Wᵀ</text>
  <rect x="246" y="280" width="36" height="30" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="264" y="300" text-anchor="middle" fill="#212529">0</text>
  <rect x="282" y="280" width="36" height="30" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="300" y="300" text-anchor="middle" fill="#212529">1</text>
  <rect x="200" y="318" width="36" height="30" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="218" y="338" text-anchor="middle" fill="#212529">2</text>
  <rect x="200" y="348" width="36" height="30" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="218" y="368" text-anchor="middle" fill="#212529">5</text>
  <rect x="246" y="318" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="264" y="338" text-anchor="middle" fill="#212529">0</text>
  <rect x="282" y="318" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="300" y="338" text-anchor="middle" fill="#212529">2</text>
  <rect x="246" y="348" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="264" y="368" text-anchor="middle" fill="#212529">0</text>
  <rect x="282" y="348" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="300" y="368" text-anchor="middle" fill="#212529">5</text>
  <text x="282" y="400" text-anchor="middle" fill="#212529">i = 2</text>
  <text x="218" y="306" text-anchor="middle" font-size="12" fill="#495057">x</text>
  <text x="332" y="300" text-anchor="start" font-size="12" fill="#495057">Wᵀ</text>
  <rect x="406" y="280" width="36" height="30" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="424" y="300" text-anchor="middle" fill="#212529">2</text>
  <rect x="442" y="280" width="36" height="30" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="460" y="300" text-anchor="middle" fill="#212529">0</text>
  <rect x="360" y="318" width="36" height="30" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="378" y="338" text-anchor="middle" fill="#212529">3</text>
  <rect x="360" y="348" width="36" height="30" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="378" y="368" text-anchor="middle" fill="#212529">6</text>
  <rect x="406" y="318" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="424" y="338" text-anchor="middle" fill="#212529">6</text>
  <rect x="442" y="318" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="460" y="338" text-anchor="middle" fill="#212529">0</text>
  <rect x="406" y="348" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="424" y="368" text-anchor="middle" fill="#212529">12</text>
  <rect x="442" y="348" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="460" y="368" text-anchor="middle" fill="#212529">0</text>
  <text x="442" y="400" text-anchor="middle" fill="#212529">i = 3</text>
  <text x="378" y="306" text-anchor="middle" font-size="12" fill="#495057">x</text>
  <text x="492" y="300" text-anchor="start" font-size="12" fill="#495057">Wᵀ</text>
  <text x="179" y="360" text-anchor="middle" font-size="20" fill="#212529">+</text>
  <text x="339" y="360" text-anchor="middle" font-size="20" fill="#212529">+</text>
  <text x="494" y="360" text-anchor="middle" font-size="18" fill="#212529">=</text>
  <text x="548" y="310" text-anchor="middle" fill="#212529">y</text>
  <rect x="512" y="318" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="530" y="338" text-anchor="middle" fill="#212529">7</text>
  <rect x="548" y="318" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="566" y="338" text-anchor="middle" fill="#212529">5</text>
  <rect x="512" y="348" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="530" y="368" text-anchor="middle" fill="#212529">16</text>
  <rect x="548" y="348" width="36" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
  <text x="566" y="368" text-anchor="middle" fill="#212529">17</text>
  <text x="612" y="334" text-anchor="start" font-size="14" fill="#212529"><tspan>y</tspan><tspan dy="4" font-size="0.72em">1,1</tspan><tspan dy="-4"> = 1 + 0 + 6 = 7</tspan></text>
  <text x="612" y="356" text-anchor="start" fill="#495057">the same three products as in (a),</text>
  <text x="612" y="374" text-anchor="start" fill="#495057">one from each grid, in the same order.</text>
  <text x="612" y="400" text-anchor="start" fill="#495057">Each grid: 4 values read, 4 multiply-adds.</text>
</svg>
