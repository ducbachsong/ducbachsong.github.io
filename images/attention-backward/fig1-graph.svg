<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="860" height="402" fill="#ffffff"/>
  <text x="20" y="26" text-anchor="start" font-size="15" fill="#212529" font-weight="600">One head: how token t takes in token j (j ≤ t), every use of every value</text>
  <text x="20" y="44" text-anchor="start" font-size="13" fill="#495057">Each arrow is one use, labelled with the forward step that makes it (F) and the backward step that goes back along it (B).</text>
  <text x="20" y="60" text-anchor="start" font-size="13" fill="#495057">The same picture holds for every pair j ≤ t: q and S are shared by a whole row, k and v by every later token, so their gradients are sums.</text>
  <rect x="55.0" y="103.0" width="70" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="90" y="125.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">q<tspan dy="4" font-size="0.7em">t</tspan><tspan dy="-4"></tspan></text>
  <rect x="55.0" y="183.0" width="70" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="90" y="205.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">k<tspan dy="4" font-size="0.7em">j</tspan><tspan dy="-4"></tspan></text>
  <rect x="55.0" y="303.0" width="70" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="90" y="325.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">v<tspan dy="4" font-size="0.7em">j</tspan><tspan dy="-4"></tspan></text>
  <rect x="215.0" y="143.0" width="70" height="34" rx="6" fill="#f8f9fa" stroke="#868e96"/>
  <text x="250" y="165.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">s<tspan dy="4" font-size="0.7em">tj</tspan><tspan dy="-4"></tspan></text>
  <rect x="375.0" y="143.0" width="70" height="34" rx="6" fill="#f8f9fa" stroke="#868e96"/>
  <text x="410" y="165.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">e<tspan dy="4" font-size="0.7em">tj</tspan><tspan dy="-4"></tspan></text>
  <rect x="485.0" y="87.0" width="70" height="34" rx="6" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="520" y="109.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">S<tspan dy="4" font-size="0.7em">t</tspan><tspan dy="-4"></tspan></text>
  <rect x="595.0" y="143.0" width="70" height="34" rx="6" fill="#f8f9fa" stroke="#868e96"/>
  <text x="630" y="165.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">a<tspan dy="4" font-size="0.7em">tj</tspan><tspan dy="-4"></tspan></text>
  <rect x="755.0" y="223.0" width="70" height="34" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="790" y="245.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">y<tspan dy="4" font-size="0.7em">t</tspan><tspan dy="-4"></tspan></text>
  <line x1="125" y1="125" x2="213" y2="152" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="126" text-anchor="middle" font-size="12" fill="#212529">F2 · <tspan fill="#e8590c" font-weight="600">B7</tspan></text>
  <line x1="125" y1="195" x2="213" y2="168" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="200" text-anchor="middle" font-size="12" fill="#212529">F2 · <tspan fill="#e8590c" font-weight="600">B8</tspan></text>
  <line x1="285" y1="160" x2="373" y2="160" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="329" y="152" text-anchor="middle" font-size="12" fill="#212529">F4 · <tspan fill="#e8590c" font-weight="600">B6</tspan></text>
  <line x1="430" y1="143" x2="485" y2="115" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="445" y="118" text-anchor="end" font-size="12" fill="#212529">F4 · <tspan fill="#e8590c" font-weight="600">B5</tspan></text>
  <line x1="445" y1="160" x2="593" y2="160" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="519" y="177" text-anchor="middle" font-size="12" fill="#212529">F4 · <tspan fill="#e8590c" font-weight="600">B5</tspan></text>
  <line x1="555" y1="115" x2="610" y2="143" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="595" y="118" text-anchor="start" font-size="12" fill="#212529">F4 · <tspan fill="#e8590c" font-weight="600">B4</tspan></text>
  <line x1="665" y1="168" x2="753" y2="232" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="722" y="188" text-anchor="start" font-size="12" fill="#212529">F5 · <tspan fill="#e8590c" font-weight="600">B2</tspan></text>
  <line x1="125" y1="320" x2="753" y2="248" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="300" text-anchor="middle" font-size="12" fill="#212529">F5 · <tspan fill="#e8590c" font-weight="600">B3</tspan></text>
  <text x="250" y="196" text-anchor="middle" font-size="11" fill="#868e96">q · k / √d</text>
  <text x="250" y="210" text-anchor="middle" font-size="11" fill="#1971c2">1 (t = 2, j = 0)</text>
  <text x="410" y="196" text-anchor="middle" font-size="11" fill="#868e96">exp(s − m)</text>
  <text x="410" y="210" text-anchor="middle" font-size="11" fill="#1971c2">0.3678794</text>
  <text x="520" y="80" text-anchor="middle" font-size="11" fill="#1971c2">sum over j ≤ t: 1.7357589</text>
  <text x="630" y="196" text-anchor="middle" font-size="11" fill="#868e96">e / S: the weight</text>
  <text x="630" y="210" text-anchor="middle" font-size="11" fill="#1971c2">0.2119416</text>
  <text x="790" y="276" text-anchor="middle" font-size="11" fill="#868e96">sum over j ≤ t of a v</text>
  <text x="790" y="290" text-anchor="middle" font-size="11" fill="#1971c2">0.2119 0.2119 0.5761 0</text>
  <text x="90" y="146" text-anchor="middle" font-size="11" fill="#1971c2">2 2 0 0</text>
  <text x="90" y="226" text-anchor="middle" font-size="11" fill="#1971c2">1 0 0 0</text>
  <text x="90" y="346" text-anchor="middle" font-size="11" fill="#1971c2">1 0 0 0</text>
  <text x="20" y="372" text-anchor="start" font-size="13" fill="#495057">e is used twice, by a and by S, so B5 adds two parts. F1 (split) and F6 (merge) only move values; B9 and B1 move the gradients back.</text>
  <text x="20" y="389" text-anchor="start" font-size="13" fill="#495057">In blue, the example's token t = 2 and token j = 0. The max m of the row drops out of the gradient, as in the classifier's softmax.</text>
</svg>
