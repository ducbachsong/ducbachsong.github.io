  <text x="20" y="352" text-anchor="start" font-size="13" fill="#495057">Left: token 2 weights itself most, its score 2 against 1 and 1. Right: the loss wants output column 0 up, which is the weight on token 0,</text>
  <text x="20" y="369" text-anchor="start" font-size="13" fill="#495057">so ds pushes each row's score of token 0 up and the others down. Token 0 sees only itself: its one weight is always 1, and its ds is 0.</text>
