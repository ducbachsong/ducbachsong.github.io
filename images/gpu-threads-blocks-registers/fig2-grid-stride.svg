<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="760" height="396" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">Two ways to size a launch, on 10 values</text>
  <text x="20" y="44" fill="#495057">Each box is one value; its color and number say which thread writes it.</text>
  <text x="20" y="84" font-weight="600" fill="#212529">A. one thread per value</text>
  <text x="20" y="100" font-size="11" fill="#495057">blocks = 10 ÷ 4 threads, rounded up = 3 blocks of 4 = 12 threads</text>
  <rect x="40" y="112" width="48" height="30" fill="#ffc078" stroke="#495057"/>
  <text x="64" y="132" font-size="11" text-anchor="middle" fill="#212529">value 0</text>
  <text x="64" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 0</text>
  <rect x="92" y="112" width="48" height="30" fill="#a5d8ff" stroke="#495057"/>
  <text x="116" y="132" font-size="11" text-anchor="middle" fill="#212529">value 1</text>
  <text x="116" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 1</text>
  <rect x="144" y="112" width="48" height="30" fill="#b2f2bb" stroke="#495057"/>
  <text x="168" y="132" font-size="11" text-anchor="middle" fill="#212529">value 2</text>
  <text x="168" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 2</text>
  <rect x="196" y="112" width="48" height="30" fill="#eebefa" stroke="#495057"/>
  <text x="220" y="132" font-size="11" text-anchor="middle" fill="#212529">value 3</text>
  <text x="220" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 3</text>
  <rect x="248" y="112" width="48" height="30" fill="#ffc078" stroke="#495057"/>
  <text x="272" y="132" font-size="11" text-anchor="middle" fill="#212529">value 4</text>
  <text x="272" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 4</text>
  <rect x="300" y="112" width="48" height="30" fill="#a5d8ff" stroke="#495057"/>
  <text x="324" y="132" font-size="11" text-anchor="middle" fill="#212529">value 5</text>
  <text x="324" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 5</text>
  <rect x="352" y="112" width="48" height="30" fill="#b2f2bb" stroke="#495057"/>
  <text x="376" y="132" font-size="11" text-anchor="middle" fill="#212529">value 6</text>
  <text x="376" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 6</text>
  <rect x="404" y="112" width="48" height="30" fill="#eebefa" stroke="#495057"/>
  <text x="428" y="132" font-size="11" text-anchor="middle" fill="#212529">value 7</text>
  <text x="428" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 7</text>
  <rect x="456" y="112" width="48" height="30" fill="#ffc078" stroke="#495057"/>
  <text x="480" y="132" font-size="11" text-anchor="middle" fill="#212529">value 8</text>
  <text x="480" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 8</text>
  <rect x="508" y="112" width="48" height="30" fill="#a5d8ff" stroke="#495057"/>
  <text x="532" y="132" font-size="11" text-anchor="middle" fill="#212529">value 9</text>
  <text x="532" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 9</text>
  <rect x="560" y="112" width="48" height="30" fill="#f1f3f5" stroke="#adb5bd" stroke-dasharray="3,3"/>
  <text x="584" y="132" font-size="11" text-anchor="middle" fill="#868e96">—</text>
  <text x="584" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 10</text>
  <rect x="612" y="112" width="48" height="30" fill="#f1f3f5" stroke="#adb5bd" stroke-dasharray="3,3"/>
  <text x="636" y="132" font-size="11" text-anchor="middle" fill="#868e96">—</text>
  <text x="636" y="158" font-size="10" text-anchor="middle" fill="#495057">thread 11</text>
  <path d="M 40 166 v 6 h 204 v -6" fill="none" stroke="#495057"/>
  <text x="142" y="186" font-size="11" text-anchor="middle" fill="#495057">block 0</text>
  <path d="M 248 166 v 6 h 204 v -6" fill="none" stroke="#495057"/>
  <text x="350" y="186" font-size="11" text-anchor="middle" fill="#495057">block 1</text>
  <path d="M 456 166 v 6 h 204 v -6" fill="none" stroke="#495057"/>
  <text x="558" y="186" font-size="11" text-anchor="middle" fill="#495057">block 2</text>
  <text x="40" y="206" font-size="11" fill="#868e96">each thread does one value and stops; threads 10 and 11 find no value and return (if index &gt;= 10: return)</text>
  <text x="20" y="244" font-weight="600" fill="#212529">B. a fixed grid and a loop</text>
  <text x="20" y="260" font-size="11" fill="#495057">2 blocks of 2 threads = 4 threads, whatever the size; each thread jumps by 4, the number of threads</text>
  <rect x="40" y="272" width="48" height="30" fill="#ffc078" stroke="#495057"/>
  <text x="64" y="292" font-size="11" text-anchor="middle" fill="#212529">value 0</text>
  <text x="64" y="318" font-size="10" text-anchor="middle" fill="#495057">thread 0</text>
  <rect x="92" y="272" width="48" height="30" fill="#a5d8ff" stroke="#495057"/>
  <text x="116" y="292" font-size="11" text-anchor="middle" fill="#212529">value 1</text>
  <text x="116" y="318" font-size="10" text-anchor="middle" fill="#495057">thread 1</text>
  <rect x="144" y="272" width="48" height="30" fill="#b2f2bb" stroke="#495057"/>
  <text x="168" y="292" font-size="11" text-anchor="middle" fill="#212529">value 2</text>
  <text x="168" y="318" font-size="10" text-anchor="middle" fill="#495057">thread 2</text>
  <rect x="196" y="272" width="48" height="30" fill="#eebefa" stroke="#495057"/>
  <text x="220" y="292" font-size="11" text-anchor="middle" fill="#212529">value 3</text>
  <text x="220" y="318" font-size="10" text-anchor="middle" fill="#495057">thread 3</text>
  <rect x="248" y="272" width="48" height="30" fill="#ffc078" stroke="#495057"/>
  <text x="272" y="292" font-size="11" text-anchor="middle" fill="#212529">value 4</text>
  <text x="272" y="318" font-size="10" text-anchor="middle" fill="#495057">thread 0</text>
  <rect x="300" y="272" width="48" height="30" fill="#a5d8ff" stroke="#495057"/>
  <text x="324" y="292" font-size="11" text-anchor="middle" fill="#212529">value 5</text>
  <text x="324" y="318" font-size="10" text-anchor="middle" fill="#495057">thread 1</text>
  <rect x="352" y="272" width="48" height="30" fill="#b2f2bb" stroke="#495057"/>
  <text x="376" y="292" font-size="11" text-anchor="middle" fill="#212529">value 6</text>
  <text x="376" y="318" font-size="10" text-anchor="middle" fill="#495057">thread 2</text>
  <rect x="404" y="272" width="48" height="30" fill="#eebefa" stroke="#495057"/>
  <text x="428" y="292" font-size="11" text-anchor="middle" fill="#212529">value 7</text>
  <text x="428" y="318" font-size="10" text-anchor="middle" fill="#495057">thread 3</text>
  <rect x="456" y="272" width="48" height="30" fill="#ffc078" stroke="#495057"/>
  <text x="480" y="292" font-size="11" text-anchor="middle" fill="#212529">value 8</text>
  <text x="480" y="318" font-size="10" text-anchor="middle" fill="#495057">thread 0</text>
  <rect x="508" y="272" width="48" height="30" fill="#a5d8ff" stroke="#495057"/>
  <text x="532" y="292" font-size="11" text-anchor="middle" fill="#212529">value 9</text>
  <text x="532" y="318" font-size="10" text-anchor="middle" fill="#495057">thread 1</text>
  <path d="M 40 326 v 6 h 204 v -6" fill="none" stroke="#495057"/>
  <text x="142" y="346" font-size="11" text-anchor="middle" fill="#495057">round 1</text>
  <path d="M 248 326 v 6 h 204 v -6" fill="none" stroke="#495057"/>
  <text x="350" y="346" font-size="11" text-anchor="middle" fill="#495057">round 2</text>
  <path d="M 456 326 v 6 h 100 v -6" fill="none" stroke="#495057"/>
  <text x="506" y="346" font-size="11" text-anchor="middle" fill="#495057">round 3</text>
  <text x="40" y="366" font-size="11" fill="#868e96">thread 0 does values 0, 4, 8; thread 1 does 1, 5, 9; threads 2 and 3 do 2, 6 and 3, 7</text>
  <text x="40" y="380" font-size="11" fill="#868e96">more values only mean more rounds; the launch stays the same</text>
</svg>
