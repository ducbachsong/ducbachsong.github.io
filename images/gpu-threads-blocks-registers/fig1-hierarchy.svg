  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">From the launch to the hardware: blocks go to SMs, an SM holds several blocks, a warp is 32 threads</text>
  <text x="20" y="44" fill="#495057">&lt;&lt;&lt;2048, 256&gt;&gt;&gt; on a Tesla T4: each SM holds 4 blocks of 256 threads; 160 blocks run at once, in about 13 waves.</text>
