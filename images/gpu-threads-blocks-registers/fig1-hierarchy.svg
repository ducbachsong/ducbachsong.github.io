  <text x="140" y="316" font-size="11" fill="#495057">when a block ends, its SM takes the next block from the queue: 2048 / 160 = 12.8 waves;</text>
  <text x="140" y="330" font-size="11" fill="#495057">in the last wave, blocks 1920–2047 fill 32 SMs and 8 SMs have nothing to do</text>
