  <text x="102" y="172" font-size="9" text-anchor="end" fill="#868e96">r0</text>
  <text x="102" y="184" font-size="9" text-anchor="end" fill="#868e96">r1</text>
  <text x="102" y="196" font-size="9" text-anchor="end" fill="#868e96">r2</text>
  <text x="102" y="208" font-size="9" text-anchor="end" fill="#868e96">…</text>
  <text x="110" y="228" font-size="10" fill="#868e96">thread:  0 … 31</text>
  <text x="560" y="176" font-size="11" fill="#495057">thread 5's r0 and thread 6's r0</text>
  <text x="560" y="190" font-size="11" fill="#495057">are two different registers,</text>
  <text x="560" y="204" font-size="11" fill="#495057">holding two different ids</text>
  <line x1="20" y1="248" x2="740" y2="248" stroke="#e9ecef"/>
  <text x="20" y="272" font-weight="600" fill="#212529">What fills registers is values alive at the same time, not lines of code</text>
  <text x="20" y="300" font-size="12" font-weight="600" fill="#495057">4 temporaries, 1 register</text>
  <text x="20" y="322" font-size="11" fill="#212529">a = x * 2</text>
  <text x="20" y="340" font-size="11" fill="#212529">b = a + 1</text>
  <text x="20" y="358" font-size="11" fill="#212529">c = b * b</text>
  <text x="20" y="376" font-size="11" fill="#212529">d = c - 3; store d</text>
  <rect x="230" y="311" width="30" height="12" fill="#ffc078" stroke="none"/>
  <rect x="260" y="329" width="30" height="12" fill="#ffc078" stroke="none"/>
  <rect x="290" y="347" width="30" height="12" fill="#ffc078" stroke="none"/>
  <rect x="320" y="365" width="30" height="12" fill="#ffc078" stroke="none"/>
  <text x="20" y="402" font-size="11" fill="#d9480f">each value dies when the next is made: they can share one register</text>
  <text x="230" y="294" font-size="10" fill="#868e96">alive while:</text>
  <text x="400" y="300" font-size="12" font-weight="600" fill="#495057">64 running sums, 64 registers</text>
  <text x="400" y="322" font-size="11" fill="#212529">sum0 = 0, …, sum63 = 0</text>
  <text x="400" y="340" font-size="11" fill="#212529">for k in 0 … 767:</text>
  <text x="416" y="358" font-size="11" fill="#212529">sum0 += x[k] * w0[k]</text>
  <text x="416" y="376" font-size="11" fill="#212529">…  sum63 += …</text>
  <rect x="590" y="311" width="140" height="7" fill="#ffc078" stroke="none"/>
  <rect x="590" y="320" width="140" height="7" fill="#ffc078" stroke="none"/>
  <rect x="590" y="329" width="140" height="7" fill="#ffc078" stroke="none"/>
  <rect x="590" y="338" width="140" height="7" fill="#ffc078" stroke="none"/>
  <rect x="590" y="347" width="140" height="7" fill="#ffc078" stroke="none"/>
  <rect x="590" y="356" width="140" height="7" fill="#ffc078" stroke="none"/>
  <rect x="590" y="365" width="140" height="7" fill="#ffc078" stroke="none"/>
  <rect x="590" y="374" width="140" height="7" fill="#ffc078" stroke="none"/>
  <text x="660" y="396" font-size="10" text-anchor="middle" fill="#868e96">… all 64 alive for the whole loop</text>
  <text x="400" y="420" font-size="11" fill="#d9480f">over the 64-register limit of a 1024-thread block</text>
</svg>
