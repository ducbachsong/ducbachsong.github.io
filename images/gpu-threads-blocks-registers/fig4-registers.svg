  <rect x="100" y="72" width="10" height="30" fill="#ffa94d" stroke="none"/>
  <rect x="100" y="72" width="640" height="30" fill="none" stroke="#495057"/>
  <text x="260" y="92" font-size="11" text-anchor="middle" fill="#212529">block 0: 32 warps × 1,024 = 32,768</text>
  <text x="580" y="92" font-size="11" text-anchor="middle" fill="#868e96">free: 32,768</text>
  <text x="100" y="118" font-size="11" fill="#495057">each tick = one warp's 32 threads × 32 registers = 1,024 (an encoder thread needs about 26, rounded up to 32)</text>
  <text x="100" y="132" font-size="11" fill="#868e96">the free half stays empty: the SM already holds 1024 threads, its limit, so no 2nd block can come</text>
  <text x="20" y="176" font-weight="600" fill="#212529">warp 0</text>
