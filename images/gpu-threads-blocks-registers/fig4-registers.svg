  <rect width="760" height="440" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">Registers: 65,536 per SM, handed out to threads; a kernel needs as many as it keeps alive at once</text>
  <text x="20" y="44" fill="#495057">Each thread owns its registers. The compiler picks the count per kernel; the GPU rounds it up to a multiple of 8.</text>
  <text x="20" y="84" font-weight="600" fill="#212529">one SM's</text>
  <text x="20" y="100" font-weight="600" fill="#212529">registers</text>
  <defs><pattern id="units" width="10" height="10" patternUnits="userSpaceOnUse" x="100"><line x1="0" y1="0" x2="0" y2="10" stroke="#495057" stroke-width="0.4"/></pattern></defs>
