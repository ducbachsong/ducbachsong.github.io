<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="760" height="384" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">Why waiting for memory does not stop the SM: while one warp waits, the others ask too</text>
  <text x="20" y="44" fill="#495057">Each warp asks for its data, waits about 300 cycles (296 measured on a T4), adds, writes, and asks again.</text>
  <line x1="150" y1="62" x2="150" y2="300" stroke="#e9ecef"/>
  <text x="150" y="316" font-size="10" text-anchor="middle" fill="#868e96">0</text>
  <line x1="260" y1="62" x2="260" y2="300" stroke="#e9ecef"/>
  <text x="260" y="316" font-size="10" text-anchor="middle" fill="#868e96">200</text>
  <line x1="370" y1="62" x2="370" y2="300" stroke="#e9ecef"/>
  <text x="370" y="316" font-size="10" text-anchor="middle" fill="#868e96">400</text>
  <line x1="480" y1="62" x2="480" y2="300" stroke="#e9ecef"/>
  <text x="480" y="316" font-size="10" text-anchor="middle" fill="#868e96">600</text>
  <line x1="590" y1="62" x2="590" y2="300" stroke="#e9ecef"/>
  <text x="590" y="316" font-size="10" text-anchor="middle" fill="#868e96">800</text>
  <line x1="700" y1="62" x2="700" y2="300" stroke="#e9ecef"/>
  <text x="700" y="316" font-size="10" text-anchor="middle" fill="#868e96">1000</text>
  <text x="425" y="332" font-size="11" text-anchor="middle" fill="#868e96">cycles</text>
  <text x="20" y="85" font-size="12" fill="#212529">warp 0</text>
  <rect x="150" y="72" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="158" y="76" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="315" y="72" width="22" height="18" fill="#ffc078" stroke="none"/>
  <text x="164" y="68" font-size="10" fill="#495057">ask (load)</text>
  <text x="232.5" y="85" font-size="10" text-anchor="middle" fill="#868e96">waiting for wte, wpe</text>
  <text x="341" y="68" font-size="10" fill="#d9480f">add + write</text>
  <rect x="331.5" y="72" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="339.5" y="76" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="496.5" y="72" width="22" height="18" fill="#ffc078" stroke="none"/>
  <text x="20" y="119" font-size="12" fill="#212529">warp 1</text>
  <rect x="166.5" y="106" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="174.5" y="110" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="331.5" y="106" width="22" height="18" fill="#ffc078" stroke="none"/>
  <rect x="348" y="106" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="356" y="110" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="513" y="106" width="22" height="18" fill="#ffc078" stroke="none"/>
  <text x="20" y="153" font-size="12" fill="#212529">warp 2</text>
  <rect x="183" y="140" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="191" y="144" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="348" y="140" width="22" height="18" fill="#ffc078" stroke="none"/>
  <rect x="364.5" y="140" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="372.5" y="144" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="529.5" y="140" width="22" height="18" fill="#ffc078" stroke="none"/>
  <text x="20" y="187" font-size="12" fill="#212529">warp 3</text>
  <rect x="199.5" y="174" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="207.5" y="178" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="364.5" y="174" width="22" height="18" fill="#ffc078" stroke="none"/>
  <rect x="381" y="174" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="389" y="178" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="546" y="174" width="22" height="18" fill="#ffc078" stroke="none"/>
  <text x="20" y="221" font-size="12" fill="#212529">warp 4</text>
  <rect x="216" y="208" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="224" y="212" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="381" y="208" width="22" height="18" fill="#ffc078" stroke="none"/>
  <rect x="397.5" y="208" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="405.5" y="212" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="562.5" y="208" width="22" height="18" fill="#ffc078" stroke="none"/>
  <text x="20" y="255" font-size="12" fill="#212529">warp 31</text>
  <rect x="232.5" y="242" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="240.5" y="246" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="397.5" y="242" width="22" height="18" fill="#ffc078" stroke="none"/>
  <rect x="414" y="242" width="8" height="18" fill="#495057" stroke="none"/>
  <rect x="422" y="246" width="157" height="10" fill="#f1f3f5" stroke="none"/>
  <rect x="579" y="242" width="22" height="18" fill="#ffc078" stroke="none"/>
  <text x="20" y="293" font-size="12" font-weight="600" fill="#212529">memory</text>
  <rect x="315" y="280" width="385" height="18" fill="#a5d8ff" stroke="none"/>
  <text x="232.5" y="293" font-size="10" text-anchor="middle" fill="#868e96">first answers on their way</text>
  <text x="507.5" y="293" font-size="10" text-anchor="middle" fill="#212529">answers arrive one after another: memory stays busy</text>
  <text x="20" y="352" font-size="11" fill="#495057">A store gives no result that a later instruction waits for, so the warp goes on to its next instruction.</text>
  <text x="20" y="368" font-size="11" fill="#495057">What sets the speed is the memory bandwidth (320 GB/s on a T4), not the 300 cycles.</text>
</svg>
