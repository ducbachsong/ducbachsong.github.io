<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#212529">Spending registers on loads in flight: one thread, one float4 per round or four</text>
  <text x="20" y="44" fill="#495057">Each round asks for wte and wpe, waits about 300 cycles, then adds and stores. Illustrative timings.</text>
  <line x1="200" y1="62" x2="200" y2="250" stroke="#e9ecef"/>
  <text x="200" y="266" font-size="10" text-anchor="middle" fill="#868e96">0</text>
  <line x1="286" y1="62" x2="286" y2="250" stroke="#e9ecef"/>
  <text x="286" y="266" font-size="10" text-anchor="middle" fill="#868e96">200</text>
  <line x1="372" y1="62" x2="372" y2="250" stroke="#e9ecef"/>
  <text x="372" y="266" font-size="10" text-anchor="middle" fill="#868e96">400</text>
  <line x1="458" y1="62" x2="458" y2="250" stroke="#e9ecef"/>
  <text x="458" y="266" font-size="10" text-anchor="middle" fill="#868e96">600</text>
  <line x1="544" y1="62" x2="544" y2="250" stroke="#e9ecef"/>
  <text x="544" y="266" font-size="10" text-anchor="middle" fill="#868e96">800</text>
  <line x1="630" y1="62" x2="630" y2="250" stroke="#e9ecef"/>
  <text x="630" y="266" font-size="10" text-anchor="middle" fill="#868e96">1000</text>
  <text x="415" y="282" font-size="11" text-anchor="middle" fill="#868e96">cycles</text>
  <text x="20" y="98" font-size="12" font-weight="600" fill="#212529">1 float4 per round</text>
  <text x="20" y="114" font-size="11" fill="#868e96">≈ 26 registers</text>
  <rect x="200" y="86" width="4" height="8" fill="#495057" stroke="none"/>
  <rect x="204" y="88" width="125" height="4" fill="#f1f3f5" stroke="none"/>
  <rect x="329" y="86" width="7.44" height="8" fill="#ffc078" stroke="none"/>
  <rect x="335.02" y="86" width="4" height="8" fill="#495057" stroke="none"/>
  <rect x="339.02" y="88" width="125" height="4" fill="#f1f3f5" stroke="none"/>
  <rect x="464.02" y="86" width="7.44" height="8" fill="#ffc078" stroke="none"/>
  <rect x="470.04" y="86" width="4" height="8" fill="#495057" stroke="none"/>
  <rect x="474.04" y="88" width="125" height="4" fill="#f1f3f5" stroke="none"/>
  <rect x="599.04" y="86" width="7.44" height="8" fill="#ffc078" stroke="none"/>
  <text x="642" y="98" font-size="12" font-weight="600" fill="#d9480f">3 float4s</text>
  <text x="642" y="114" font-size="11" fill="#868e96">in 1,000 cycles</text>
  <text x="20" y="178" font-size="12" font-weight="600" fill="#212529">4 float4s per round</text>
  <text x="20" y="194" font-size="11" fill="#868e96">≈ 52 registers (estimate)</text>
  <rect x="200" y="166" width="4" height="8" fill="#495057" stroke="none"/>
  <rect x="204" y="168" width="130.16" height="4" fill="#f1f3f5" stroke="none"/>
  <rect x="201.72" y="175" width="4" height="8" fill="#495057" stroke="none"/>
  <rect x="205.72" y="177" width="128.44" height="4" fill="#f1f3f5" stroke="none"/>
  <rect x="203.44" y="184" width="4" height="8" fill="#495057" stroke="none"/>
  <rect x="207.44" y="186" width="126.72" height="4" fill="#f1f3f5" stroke="none"/>
  <rect x="205.16" y="193" width="4" height="8" fill="#495057" stroke="none"/>
  <rect x="209.16" y="195" width="125" height="4" fill="#f1f3f5" stroke="none"/>
  <rect x="334.16" y="166" width="17.76" height="35" fill="#ffc078" stroke="none"/>
  <rect x="350.5" y="166" width="4" height="8" fill="#495057" stroke="none"/>
  <rect x="354.5" y="168" width="130.16" height="4" fill="#f1f3f5" stroke="none"/>
  <rect x="352.22" y="175" width="4" height="8" fill="#495057" stroke="none"/>
  <rect x="356.22" y="177" width="128.44" height="4" fill="#f1f3f5" stroke="none"/>
  <rect x="353.94" y="184" width="4" height="8" fill="#495057" stroke="none"/>
  <rect x="357.94" y="186" width="126.72" height="4" fill="#f1f3f5" stroke="none"/>
  <rect x="355.66" y="193" width="4" height="8" fill="#495057" stroke="none"/>
  <rect x="359.66" y="195" width="125" height="4" fill="#f1f3f5" stroke="none"/>
  <rect x="484.66" y="166" width="17.76" height="35" fill="#ffc078" stroke="none"/>
  <text x="642" y="178" font-size="12" font-weight="600" fill="#d9480f">8 float4s</text>
  <text x="642" y="194" font-size="11" fill="#868e96">in 1,000 cycles</text>
  <text x="202" y="78" font-size="10" fill="#495057">ask</text>
  <text x="264.5" y="78" font-size="10" text-anchor="middle" fill="#868e96">waiting</text>
  <text x="331.58" y="78" font-size="10" fill="#d9480f">add, store</text>
  <text x="20" y="306" font-size="11" fill="#495057">The second thread asks for all four before it uses any, so the four waits overlap. Each float4 in flight needs its own</text>
  <text x="20" y="322" font-size="11" fill="#495057">registers: 4 for the wte part and 4 for the wpe part. With the same warps, the SM keeps 4 times as many requests on their way.</text>
</svg>
