<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 345" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="860" height="345" fill="#ffffff"/>
  <text x="20" y="26" text-anchor="start" font-size="15" fill="#212529" font-weight="600">One residual add: every use of every value</text>
  <text x="20" y="44" text-anchor="start" font-size="13" fill="#495057">Each arrow is one use, labelled with the forward step that makes it (F) and the backward step that goes back along it (B).</text>
  <text x="20" y="60" text-anchor="start" font-size="13" fill="#495057">r has two arrows going out: straight into the add (F1), and into the branch. So its gradient has two parts.</text>
  <rect x="70.0" y="197.0" width="80" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="110" y="220.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">r</text>
  <rect x="245.0" y="102.0" width="250" height="36" rx="6" fill="#f8f9fa" stroke="#868e96"/>
  <text x="370" y="124.55" text-anchor="middle" font-size="13" fill="#212529">branch: LayerNorm → attention or MLP</text>
  <rect x="550.0" y="102.0" width="80" height="36" rx="6" fill="#f8f9fa" stroke="#868e96"/>
  <text x="590" y="125.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">b</text>
  <circle cx="660" cy="215" r="18" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="660" y="221" text-anchor="middle" font-size="18" fill="#2f9e44" font-weight="600">+</text>
  <rect x="740.0" y="197.0" width="80" height="36" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="780" y="220.6" text-anchor="middle" font-size="16" fill="#212529" font-style="italic">y</text>
  <line x1="150" y1="215" x2="640" y2="215" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="207" text-anchor="middle" font-size="12" fill="#212529">F1 · <tspan fill="#e8590c" font-weight="600">B2</tspan>: the skip, straight into the add</text>
  <path d="M 120 197 C 120 120, 200 120, 243 120" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="104" text-anchor="middle" font-size="12" fill="#212529">the branch · <tspan fill="#e8590c" font-weight="600">B3</tspan></text>
  <line x1="495" y1="120" x2="548" y2="120" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 630 120 C 660 120, 660 160, 660 195" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="668" y="166" text-anchor="start" font-size="12" fill="#212529">F1 · <tspan fill="#e8590c" font-weight="600">B1</tspan></text>
  <line x1="678" y1="215" x2="738" y2="215" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="215" x2="850" y2="215" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="110" y="251" text-anchor="middle" font-size="11" fill="#868e96">residual: the block's input</text>
  <text x="110" y="267" text-anchor="middle" font-size="11" fill="#1971c2">1, 2, 3, 4</text>
  <text x="590" y="156" text-anchor="middle" font-size="11" fill="#868e96">branch_output</text>
  <text x="590" y="172" text-anchor="middle" font-size="11" fill="#1971c2">0.5, −2, 0, 2</text>
  <text x="780" y="251" text-anchor="middle" font-size="11" fill="#868e96">output = r + b</text>
  <text x="780" y="267" text-anchor="middle" font-size="11" fill="#1971c2">1.5, 0, 3, 6</text>
  <text x="370" y="156" text-anchor="middle" font-size="11" fill="#868e96">the example's stand-in: b = w · r, w = [0.5, −1, 0, 0.5]</text>
  <text x="20" y="267" text-anchor="start" font-size="11" fill="#1971c2">example:</text>
  <text x="20" y="310" text-anchor="start" font-size="13" fill="#495057">Going back, dy reaches the add and goes on unchanged along both of its arrows: B1 gives db = dy,</text>
  <text x="20" y="327" text-anchor="start" font-size="13" fill="#495057">B2 gives dr<tspan dy="-5" font-size="0.75em">(1)</tspan><tspan dy="5"> = dy. B3 takes db back through the branch to give dr</tspan><tspan dy="-5" font-size="0.75em">(2)</tspan><tspan dy="5">, and B4 adds the two parts of dr.</tspan></text>
</svg>
