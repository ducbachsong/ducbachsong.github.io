  <text x="82" y="94.0" text-anchor="end" font-size="11" fill="#868e96">10<tspan dy="-5" font-size="0.75em">2</tspan></text>
  <line x1="90" y1="124.1" x2="660" y2="124.1" stroke="#e9ecef"/>
  <text x="82" y="128.1" text-anchor="end" font-size="11" fill="#868e96">10<tspan dy="-5" font-size="0.75em">−2</tspan></text>
  <line x1="90" y1="158.2" x2="660" y2="158.2" stroke="#e9ecef"/>
  <text x="82" y="162.2" text-anchor="end" font-size="11" fill="#868e96">10<tspan dy="-5" font-size="0.75em">−6</tspan></text>
  <line x1="90" y1="192.4" x2="660" y2="192.4" stroke="#e9ecef"/>
  <text x="82" y="196.4" text-anchor="end" font-size="11" fill="#868e96">10<tspan dy="-5" font-size="0.75em">−10</tspan></text>
  <line x1="90" y1="226.5" x2="660" y2="226.5" stroke="#e9ecef"/>
  <text x="82" y="230.5" text-anchor="end" font-size="11" fill="#868e96">10<tspan dy="-5" font-size="0.75em">−14</tspan></text>
  <line x1="90" y1="260.6" x2="660" y2="260.6" stroke="#e9ecef"/>
  <text x="82" y="264.6" text-anchor="end" font-size="11" fill="#868e96">10<tspan dy="-5" font-size="0.75em">−18</tspan></text>
  <line x1="90" y1="294.7" x2="660" y2="294.7" stroke="#e9ecef"/>
  <text x="82" y="298.7" text-anchor="end" font-size="11" fill="#868e96">10<tspan dy="-5" font-size="0.75em">−22</tspan></text>
  <line x1="90" y1="328.8" x2="660" y2="328.8" stroke="#e9ecef"/>
  <text x="82" y="332.8" text-anchor="end" font-size="11" fill="#868e96">10<tspan dy="-5" font-size="0.75em">−26</tspan></text>
