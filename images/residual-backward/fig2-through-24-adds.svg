<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="20" y="26" text-anchor="start" font-size="15" fill="#212529" font-weight="600">What reaches the first block: 24 branches, each with slope s</text>
  <text x="20" y="44" text-anchor="start" font-size="13" fill="#495057">Gradient after going back through k residual adds, starting from 1 at the loss. With the skip, each add multiplies by 1 + s;</text>
  <text x="20" y="60" text-anchor="start" font-size="13" fill="#495057">without it, by s alone. The y axis is logarithmic: each line down is 10,000 times smaller.</text>
