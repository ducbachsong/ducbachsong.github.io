  <text x="710" y="120" text-anchor="start" font-size="11" fill="#212529">with the skip, s = +0.05: 1.05<tspan dy="-5" font-size="0.75em">k</tspan></text>
  <text x="710" y="137" text-anchor="start" font-size="11" fill="#868e96">3.23 at k = 24</text>
  <line x1="680" y1="160" x2="704" y2="160" stroke="#1971c2" stroke-width="2.2"/>
  <text x="710" y="164" text-anchor="start" font-size="11" fill="#212529">with the skip, s = −0.05: 0.95<tspan dy="-5" font-size="0.75em">k</tspan></text>
  <text x="710" y="181" text-anchor="start" font-size="11" fill="#868e96">0.292 at k = 24</text>
  <line x1="680" y1="204" x2="704" y2="204" stroke="#e8590c" stroke-width="2.2"/>
  <text x="710" y="208" text-anchor="start" font-size="11" fill="#212529">no skip, s = 0.05: 0.05<tspan dy="-5" font-size="0.75em">k</tspan></text>
  <text x="710" y="225" text-anchor="start" font-size="11" fill="#868e96">6.0 × 10<tspan dy="-5" font-size="0.75em">−32</tspan> at k = 24</text>
  <text x="20" y="440" text-anchor="start" font-size="13" fill="#495057">With the skip, the gradient stays between 0.29 and 3.2: each add passes it on whole, and the branch only adds or takes a little.</text>
  <text x="20" y="456" text-anchor="start" font-size="13" fill="#495057">Without it, a branch with a small slope shrinks it 20 times at every block, and nothing is left for the first layers to learn from.</text>
</svg>
