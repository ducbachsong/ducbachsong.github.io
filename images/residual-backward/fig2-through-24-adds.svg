  <text x="82" y="366.9" text-anchor="end" font-size="11" fill="#868e96">10<tspan dy="-5" font-size="0.75em">−30</tspan></text>
  <text x="90.0" y="398" text-anchor="middle" font-size="11" fill="#868e96">0</text>
  <text x="185.0" y="398" text-anchor="middle" font-size="11" fill="#868e96">4</text>
  <text x="280.0" y="398" text-anchor="middle" font-size="11" fill="#868e96">8</text>
  <text x="375.0" y="398" text-anchor="middle" font-size="11" fill="#868e96">12</text>
  <text x="470.0" y="398" text-anchor="middle" font-size="11" fill="#868e96">16</text>
  <text x="565.0" y="398" text-anchor="middle" font-size="11" fill="#868e96">20</text>
  <text x="660.0" y="398" text-anchor="middle" font-size="11" fill="#868e96">24</text>
  <text x="375.0" y="416" text-anchor="middle" font-size="12" fill="#212529">residual adds gone back through, k (GPT-2 small has 24)</text>
  <polyline points="90.0,107.1 113.8,106.9 137.5,106.7 161.2,106.5 185.0,106.3 208.8,106.2 232.5,106.0 256.2,105.8 280.0,105.6 303.8,105.4 327.5,105.3 351.2,105.1 375.0,104.9 398.8,104.7 422.5,104.5 446.2,104.3 470.0,104.2 493.8,104.0 517.5,103.8 541.2,103.6 565.0,103.4 588.8,103.3 612.5,103.1 636.2,102.9 660.0,102.7" fill="none" stroke="#2f9e44" stroke-width="2.2"/>
